/* ====================== CHANGER SON ADRESSE E-MAIL ======================
   Une faute de frappe à l'inscription enfermait la personne dehors : elle ne
   pouvait ni confirmer son adresse, ni récupérer son mot de passe. Firebase
   envoie le message de confirmation à la NOUVELLE adresse, et n'applique le
   changement qu'une fois le lien ouvert : tant que ce n'est pas fait, on se
   connecte encore avec l'ancienne. */
function changerAdresse(depuisLaPorte){
  var user = fb.user; if(!user) return;
  openModal(
    '<header><h3>Changer mon adresse e-mail</h3>' +
    '<p>Actuellement : <b>' + esc(user.email || "inconnue") + '</b></p></header>' +
    '<div class="content">' +
      '<div class="field"><label for="ca-mail">Nouvelle adresse</label>' +
      '<input class="input" type="email" id="ca-mail" autocomplete="email" data-autofocus></div>' +
      '<div class="field"><label for="ca-pw">Ton mot de passe actuel</label>' +
      '<input class="input" type="password" id="ca-pw" autocomplete="current-password"></div>' +
      '<p class="aide">Le mot de passe est demandé par sécurité : il empêche quelqu\'un ' +
      'qui trouverait ton téléphone déverrouillé de détourner ton compte.</p>' +
      '<p class="aide">Un message partira vers la <b>nouvelle</b> adresse. Le changement ne prendra effet ' +
      'qu\'une fois son lien ouvert — d\'ici là, continue à te connecter avec l\'ancienne.</p>' +
      '<div class="err" id="ca-err"></div>' +
    "</div>" +
    '<footer><button class="btn ghost" id="ca-non">Annuler</button>' +
    '<button class="btn primary" id="ca-oui">Envoyer</button></footer>',
    function(root){
      var err = root.querySelector("#ca-err");
      root.querySelector("#ca-non").onclick = closeModal;
      root.querySelector("#ca-oui").onclick = function(){
        var b = root.querySelector("#ca-oui");
        var mail = (root.querySelector("#ca-mail").value || "").trim();
        var pw   = root.querySelector("#ca-pw").value || "";
        err.textContent = "";
        if(!mail || mail.indexOf("@") < 1){ err.textContent = "Cette adresse n'est pas valide."; return; }
        if(mail.toLowerCase() === String(user.email || "").toLowerCase()){
          err.textContent = "C'est déjà ton adresse actuelle."; return;
        }
        if(!pw){ err.textContent = "Il manque ton mot de passe."; return; }
        b.disabled = true; b.textContent = "Envoi…";
        var cred = FBLIB.EmailAuthProvider.credential(user.email, pw);
        FBLIB.reauthenticateWithCredential(user, cred)
          .then(function(){ return FBLIB.verifyBeforeUpdateEmail(user, mail); })
          .then(function(){
            closeModal();
            openModal(
              '<header><h3>Message envoyé</h3></header>' +
              '<div class="content"><p>Ouvre le message reçu à <b>' + esc(mail) + '</b> et clique sur son lien. ' +
              'Ton adresse changera à ce moment-là, et elle sera confirmée du même coup.</p>' +
              '<p class="aide">Tant que ce n\'est pas fait, connecte-toi avec ' + esc(user.email || "l'ancienne adresse") + '.</p></div>' +
              '<footer><button class="btn primary" id="ok">Compris</button></footer>',
              function(r2){ r2.querySelector("#ok").onclick = function(){
                closeModal();
                if(depuisLaPorte) FBLIB.signOut(fb.auth);
              }; }
            );
          })
          .catch(function(e){
            b.disabled = false; b.textContent = "Envoyer";
            err.textContent = authMessage(e && e.code);
          });
      };
    }
  );
}

/* Après un changement d'adresse, la carte de membre porte encore l'ancienne.
   On la remet d'aplomb à la connexion suivante — seul un parent en a le droit. */
function rafraichirMonEmail(){
  if(!MULTI || !fb.user || !moi.famille || moi.role !== "parent") return;
  var vrai = fb.user.email || "";
  var carte = MEMBRES.filter(function(m){ return m.uid === fb.user.uid; })[0];
  if(!carte || !vrai || carte.email === vrai) return;
  FBLIB.setDoc(FBLIB.doc(fb.db, "familles", moi.famille, "membres", fb.user.uid),
               { email: vrai, role: "parent", at: nowISO() }).catch(function(){});
  FBLIB.setDoc(FBLIB.doc(fb.db, "utilisateurs", fb.user.uid),
               { famille: moi.famille, role: "parent", email: vrai, at: nowISO() },
               { merge: true }).catch(function(){});
}

var DON_URL = "https://pay.sumup.com/b2c/QV2QOSWZ";
var DON_CLE = "trophee/don";

function donEtat(){
  try{ return JSON.parse(localStorage.getItem(DON_CLE)) || {}; }catch(e){ return {}; }
}
function donEcrire(o){
  try{ localStorage.setItem(DON_CLE, JSON.stringify(o)); }catch(e){}
}
function joursDepuis(iso){
  if(!iso) return 0;
  var d = (Date.now() - new Date(iso).getTime()) / 86400000;
  return isFinite(d) ? d : 0;
}

var donEssais = 0;
function peutEtreLeDon(){
  if(!MULTI || !fb.user || readOnly) return;
  if(!configurationFaite()) return;

  var e = donEtat();
  if(e.donne) return;
  if(!e.premier){ e.premier = nowISO(); donEcrire(e); return; }
  var du = !e.vu ? (joursDepuis(e.premier) >= 3) : (joursDepuis(e.vu) >= 90);
  if(!du) return;

  // On ne surgit jamais au milieu de quelque chose : ni par-dessus une autre
  // fenêtre, ni pendant qu'on saisit, ni ailleurs que sur le tableau. Sinon on
  // repasse plus tard — un appel au don qui interrompt est un appel raté.
  var occupe = document.querySelector(".modal") || saisieEnCours() || UI.view !== "home";
  if(occupe){
    if(donEssais++ < 6) setTimeout(peutEtreLeDon, 25000);
    return;
  }
  fenetreDon();
}

function authMessage(code){
  if(code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found")
    return "E-mail ou mot de passe incorrect.";
  if(code === "auth/invalid-email")          return "Cette adresse e-mail n'est pas valide.";
  if(code === "auth/user-disabled")          return "Ce compte a été désactivé dans Firebase.";
  if(code === "auth/too-many-requests")      return "Trop de tentatives. Réessaie dans quelques minutes.";
  if(code === "auth/network-request-failed") return "Pas de connexion Internet.";
  if(code === "auth/operation-not-allowed")  return "La connexion par e-mail n'est pas activée dans Firebase.";
  if(code === "auth/email-already-in-use")   return "Un compte existe déjà avec cette adresse. Connecte-toi.";
  if(code === "auth/weak-password")          return "Mot de passe trop court : six caractères au minimum.";
  if(code === "auth/missing-password")       return "Il manque le mot de passe.";
  if(code === "auth/requires-recent-login")
    return "Par sécurité, reconnecte-toi avant de changer ton adresse.";
  return "Connexion impossible (" + (code || "erreur inconnue") + ").";
}

/* ====================== SAUVEGARDE ====================== */
function setStatus(kind){
  var n = el("status"); if(!n) return;
  var dot = n.querySelector(".dot"), txt = n.querySelector(".txt");
  if(readOnly){ dot.className = "dot"; txt.textContent = "Mode lecture"; return; }
  dot.className = "dot" + (kind === "saving" ? " saving" : kind === "off" ? " off" : "");
  txt.textContent = kind === "saving" ? "Enregistrement…"
                  : kind === "saved"  ? "Synchronisé"
                  : kind === "slow"   ? "Hors ligne — sera envoyé"
                  : "Cet appareil seulement";
}
function persistLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}
/* Un réglage modifié ici n'est pas encore parti sur le serveur : pendant ce
   court instant, le serveur a une version périmée. Sans ce drapeau, un écho
   d'écriture arrivé entre-temps réappliquerait l'ancien réglage par-dessus le
   nouveau — et la modification serait perdue sans que personne le voie. */
var reglagesEnAttente = false;

/* Dernière version des réglages que ce téléphone sait partagée avec le serveur.
   Elle sert à n'écrire le document des réglages QUE s'il a vraiment changé ici.
   Sans cela, chaque point coché réécrivait les réglages tels que cet appareil
   les connaît — et un parent qui cochait un point pendant que l'autre modifiait
   un seuil remettait l'ancien seuil, sans que personne ne s'en aperçoive. */
var reglagesConnus = null;

/* L'empreinte ignore l'horodatage : sans cela, le simple fait de cocher un point
   changerait la signature et provoquerait une réécriture inutile des réglages. */
function signatureReglages(s){
  var o = settingsOf(s);
  delete o.updatedAt;
  delete o.rev;
  return JSON.stringify(o);
}

/* Les réglages portent un numéro de version, incrémenté à chaque vraie
   modification. C'est lui qui tranche quand deux versions se croisent :
   une version plus ancienne que la nôtre est du passé et n'est jamais
   réappliquée — qu'elle vienne d'un écho tardif du serveur ou d'un autre
   téléphone dont l'horloge avance. Un horodatage ne suffirait pas : il
   change aussi quand on coche un simple point. */
var sigLocale = null;
function noterSignature(){ sigLocale = signatureReglages(S); }

function touch(){
  S.updatedAt = nowISO();
  var sig = signatureReglages(S);
  if(sigLocale !== null && sig !== sigLocale) S.rev = (S.rev || 0) + 1;
  sigLocale = sig;
  reglagesEnAttente = true;
  persistLocal();
  queueSave();
  render();
}
function queueSave(now){
  if(readOnly){ return; }
  if(!fb.user){ setStatus("off"); return; }
  setStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, now ? 150 : 700);
}
function doSave(){
  if(!fb.user || !fb.base || !CFG){ setStatus("off"); return; }
  clearTimeout(slowTimer);
  slowTimer = setTimeout(function(){ setStatus("slow"); }, 6000);

  var jobs = [], touched = [];
  LISTS.forEach(function(k){
    S[k].forEach(function(it){
      if(!it || !it.id) return;
      var sig = JSON.stringify(it);
      if(savedSig[k][it.id] === sig) return;
      savedSig[k][it.id] = sig;
      touched.push([k, it.id]);
      jobs.push(FBLIB.setDoc(FBLIB.doc(fb.db, CFG.collection, CFG.document, COLS[k], it.id), it));
    });
  });
  var envoye = JSON.stringify(settingsOf(S));
  var signature = signatureReglages(S);
  var ecrireReglages = (signature !== reglagesConnus);
  if(ecrireReglages){
    jobs.push(FBLIB.setDoc(fb.base, {
      json: envoye, updatedAt: nowISO(), by: fb.user.email || ""
    }));
  }

  Promise.all(jobs).then(function(){
    clearTimeout(slowTimer);
    // On ne relâche la garde que si rien n'a bougé depuis l'envoi.
    if(signatureReglages(S) === signature){
      if(ecrireReglages) reglagesConnus = signature;
      reglagesEnAttente = false;
    }
    cloudOn = true; setStatus("saved"); renderBanners();
  }).catch(function(err){
    reglagesEnAttente = false;
    clearTimeout(slowTimer);
    touched.forEach(function(t){ delete savedSig[t[0]][t[1]]; });   // à renvoyer au prochain essai
    cloudOn = false;
    cloudWhy = "Firebase a refusé l'écriture (" + ((err && err.code) || "inconnu") + ")";
    setStatus("off"); renderBanners();
  });
}

/* ====================== TOASTS ====================== */
function toast(msg, undoFn){
  var host = el("toast");
  while(host.children.length >= 2) host.removeChild(host.firstChild);
  var d = document.createElement("div");
  d.className = "toast";
  d.innerHTML = "<span>" + esc(msg) + "</span>";
  if(undoFn){
    var b = document.createElement("button");
    b.textContent = "Annuler";
    b.onclick = function(){ undoFn(); d.remove(); };
    d.appendChild(b);
  }
  host.appendChild(d);
  setTimeout(function(){ d.remove(); }, undoFn ? 7000 : 3200);
}

/* ====================== MODALES ====================== */
function closeModal(){
  // L'assistant de première ouverture ne se referme pas par mégarde :
  // tant qu'il n'a pas abouti, l'application n'a pas de quoi fonctionner.
  if(assistantOuvert) return;
  el("modal-root").innerHTML = "";
}
function openModal(html, onMount){
  var root = el("modal-root");
  root.innerHTML = '<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">' + html + "</div></div>";
  var bd = root.querySelector(".backdrop");
  bd.addEventListener("mousedown", function(e){ if(e.target === bd) closeModal(); });
  document.addEventListener("keydown", escOnce);
  if(onMount) onMount(root);
  var f = root.querySelector("[data-autofocus]");
  if(f) setTimeout(function(){ f.focus(); }, 40);
}
function escOnce(e){
  if(e.key === "Escape"){ closeModal(); document.removeEventListener("keydown", escOnce); }
}

/* --- PIN --- */
function isUnlocked(){
  var t = parseInt(sessionStorage.getItem(UNLOCK) || "0", 10);
  return t && Date.now() < t;
}
function markUnlocked(){
  try{ sessionStorage.setItem(UNLOCK, String(Date.now() + UNLOCK_MS)); }catch(e){}
}
function refuseLecture(){
  toast("Compte en lecture seule : les points ne se modifient pas d'ici");
  return false;
}
function requirePin(reason, force){
  return new Promise(function(resolve){
    if(readOnly){ refuseLecture(); resolve(false); return; }
    if(!S.pinEnabled && !force){ resolve(true); return; }
    if(isUnlocked()){ resolve(true); return; }
    var buf = "";
    openModal(
      '<header><h3>Code parent</h3><p>' + esc(reason || "Le code à 4 chiffres est demandé pour modifier les points.") + '</p></header>' +
      '<div class="content">' +
        '<div class="pindots" id="pd"><i></i><i></i><i></i><i></i></div>' +
        '<div class="err" id="pinerr"></div>' +
        '<div class="pinpad" id="pinpad">' +
          [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button type="button" data-k="'+n+'">'+n+'</button>'; }).join("") +
          '<button type="button" data-k="del">←</button><button type="button" data-k="0">0</button>' +
          '<button type="button" data-k="cancel">Annuler</button>' +
        '</div>' +
      '</div>',
      function(root){
        function paint(){
          var dots = root.querySelectorAll("#pd i");
          for(var i=0;i<4;i++) dots[i].className = i < buf.length ? "on" : "";
        }
        root.querySelector("#pinpad").addEventListener("click", function(e){
          var b = e.target.closest("button[data-k]"); if(!b) return;
          var k = b.getAttribute("data-k");
          if(k === "cancel"){ closeModal(); resolve(false); return; }
          if(k === "del"){ buf = buf.slice(0,-1); paint(); return; }
          if(buf.length < 4){ buf += k; paint(); }
          if(buf.length === 4){
            if(buf === String(S.pin)){ markUnlocked(); closeModal(); resolve(true); }
            else{
              root.querySelector("#pinerr").textContent = "Code incorrect";
              buf = ""; setTimeout(paint, 120);
            }
          }
        });
        document.addEventListener("keydown", function kb(e){
          if(!document.body.contains(root.querySelector(".backdrop"))){ document.removeEventListener("keydown", kb); return; }
          if(/^[0-9]$/.test(e.key)){ root.querySelector('[data-k="'+e.key+'"]').click(); }
          if(e.key === "Backspace"){ root.querySelector('[data-k="del"]').click(); }
        });
      }
    );
  });
}

/* --- Ajout de point --- */
async function addPoint(childId, delta){
  var ok = await requirePin();
  if(!ok) return;
  var c = child(childId);
  var list = delta > 0 ? S.presets.good : S.presets.bad;
  openModal(
    '<header><h3>' + (delta > 0 ? "Bonne action" : "Bêtise") + " — " + esc(c.name) + '</h3>' +
    '<p>Note ce qui s\'est passé : la liste sera relue ensemble à la réunion du vendredi.</p></header>' +
    '<div class="content">' +
      '<div class="field"><label for="note">Explication</label>' +
      '<textarea class="input" id="note" data-autofocus placeholder="Ex : a aidé à débarrasser sans qu\'on demande"></textarea></div>' +
      '<div class="presets">' + list.map(function(p){ return '<button type="button" class="preset">' + esc(p) + "</button>"; }).join("") + "</div>" +
      '<div class="field"><label for="when">Quand ?</label><input class="input" type="date" id="when" value="' + todayISO() + '" max="' + todayISO() + '"></div>' +
    '</div>' +
    '<footer><button class="btn ghost" id="cancel">Annuler</button>' +
    '<button class="btn primary" id="ok">' + (delta > 0 ? "+1 point" : "−1 point") + "</button></footer>",
    function(root){
      var ta = root.querySelector("#note");
      root.querySelectorAll(".preset").forEach(function(b){
        b.onclick = function(){ ta.value = b.textContent; ta.focus(); };
      });
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        var note = ta.value.trim();
        if(note.length < 2){ ta.focus(); ta.style.borderColor = "var(--dang)"; return; }
        var d = root.querySelector("#when").value || todayISO();
        var at = (d === todayISO()) ? nowISO() : d + "T20:00:00.000Z";
        if(!S.weekStart) S.weekStart = nowISO();
        var ev = { id: uid(), child: childId, delta: delta, note: note, at: at,
                   week: S.weekStart, by: meEmail(), deleted: false };
        S.events.push(ev);
        closeModal();
        touch();
        var total = scoreOf(childId);
        var extra = "";
        if(total <= S.thresholds.punish) extra = " — zone rouge !";
        else if(total <= S.thresholds.warn) extra = " — zone orange";
        toast(c.name + " : " + (delta > 0 ? "+1" : "−1") + " (total " + sgn(total) + ")" + extra, function(){
          var t = S.events.filter(function(x){ return x.id === ev.id; })[0];
          if(t){ t.deleted = true; touch(); }
        });
      };
    }
  );
}

function editEvent(id){
  var t = S.events.filter(function(x){ return x.id === id; })[0];

        }).join("") +

    "</div>" +
    '<footer><button class="btn ghost" id="cancel">Annuler</button>' +
    '<button class="btn primary" id="ok">Enregistrer</button></footer>',
    function(root){
      var sens = t.delta > 0 ? 1 : -1;
      function peindre(){
        root.querySelectorAll("[data-sens]").forEach(function(b){
          b.setAttribute("aria-pressed", String(parseInt(b.getAttribute("data-sens"), 10) === sens));
        });
      }
      root.querySelectorAll("[data-sens]").forEach(function(b){
        b.onclick = function(){ sens = parseInt(b.getAttribute("data-sens"), 10); peindre(); };
      });
      var ta = root.querySelector("#enote");

        if(!cur) return;
        cur.note = note;
        cur.delta = sens;
        cur.by = auteur;
        if(d !== dateOnly(cur.at)) cur.at = (d === todayISO()) ? nowISO() : d + "T20:00:00.000Z";
        cur.modifiedBy = meEmail();
        cur.modifiedAt = nowISO();
        touch();
        toast("Ligne modifiée");

  );

/* --- Cagnotte : écran détaillé --- */
function cagLog(childId){
  return S.cagnotteLog.filter(function(l){ return !l.deleted && l.child === childId; })
                      .sort(function(a,b){ return a.at < b.at ? 1 : -1; });
}
function cagKindLabel(l){
  if(l.kind === "bonus") return "Ajout exceptionnel";
  if(l.kind === "achat") return "Achat déduit";
  return l.delta >= 0 ? "Réunion du vendredi" : "Retrait";
}
function openCagnotte(childId, form){
  var c = child(childId);
  var solde = cagnotteOf(childId);
  var log = cagLog(childId);
  var h = "";

  h += '<header><h3>' + esc(nomCagnotte()) + ' — ' + esc(c.name) + '</h3>' +
       '<p>La réserve de ' + esc(c.name) + '. Elle se remplit à la réunion (' +
       fMontant(S.palierValue) + ' dès que la semaine est positive, ' + fMontant(S.palierValue) +
       ' de plus par palier de ' + S.palier + ' points) et par les ajouts exceptionnels.</p></header>';
  h += '<div class="content">';

  h += '<div class="cagsum"><div><div class="eyebrow">Solde du porte-monnaie</div>' +
       '<div class="cagbig mono">' + solde + ' <small>' + esc(U()) + '</small></div></div>' +
       '<div class="cagright"><div class="cagnext">' + log.length + ' mouvement' + (log.length > 1 ? "s" : "") + '</div></div></div>';

  if(readOnly){
    h += '<p style="font-size:.85rem;color:var(--ink-3);margin:12px 0 0">Consultation seule : le porte-monnaie se modifie depuis un compte parent.</p>';
  } else if(!form){
    h += '<div class="btnrow" style="margin-top:14px">' +
         '<button class="btn" id="cag-add" style="flex:1;background:var(--pos-bg);color:var(--pos);border-color:var(--pos-line)">+ Ajouter un montant</button>' +
         '<button class="btn" id="cag-sub" style="flex:1;background:var(--dang-bg);color:var(--dang);border-color:var(--dang-line)">− Déduire un achat</button>' +
         '</div>';
  } else {
    var isAdd = form === "add";
    var presets = isAdd ? S.presets.cagAdd : S.presets.cagSub;
    h += '<div class="cagform">' +
         '<div class="eyebrow">' + (isAdd ? "Ajout exceptionnel" : "Achat à déduire") + '</div>' +
         '<div class="field"><label for="cag-n">Montant en euros</label>' +
         '<div class="amtrow"><input class="input mono" type="number" id="cag-n" min="1" step="1" value="' +
         (isAdd ? 5 : Math.max(1, Math.min(5, solde || 1))) + '" data-autofocus>' +
         '<span class="amtunit" id="cag-eq">' + esc(U()) + '</span></div>' +
         (isAdd ? "" : '<div class="aide" id="cag-warn"></div>') + '</div>' +
         '<div class="field"><label for="cag-note">' + (isAdd ? "Pour quelle raison ?" : "Pour quel achat ?") + '</label>' +
         '<input class="input" id="cag-note" placeholder="' + (isAdd ? "Ex : a aidé toute la journée au garage" : "Ex : figurine achetée samedi") + '"></div>' +
         '<div class="presets">' + presets.map(function(p){ return '<button type="button" class="preset">' + esc(p) + "</button>"; }).join("") + "</div>" +
         '<div class="field"><label for="cag-date">Date</label><input class="input" type="date" id="cag-date" value="' + todayISO() + '"></div>' +
         '<div class="btnrow" style="margin-top:14px"><button class="btn ghost" id="cag-back">Annuler</button>' +
         '<button class="btn primary" id="cag-ok">' + (isAdd ? "Ajouter à la réserve" : "Retirer de la réserve") + '</button></div>' +
         '</div>';
  }

  h += '<div class="eyebrow" style="margin-top:20px">Historique — ' + esc(nomCagnotte()) + '</div>';
  if(!log.length){
    h += '<div class="empty" style="padding:22px 0">Réserve vide. Elle se remplit à la réunion, ou ici avec un ajout exceptionnel.</div>';
  } else {
    h += '<div class="caglog">';
    var running = solde;
    log.forEach(function(l){
      h += '<div class="cagrow"><div class="delta ' + (l.delta >= 0 ? "p" : "m") + '">' + sgn(l.delta) + "</div>" +
           '<div class="cagbody"><div class="cagnote">' + esc(l.note) + "</div>" +
           '<div class="when">' + cagKindLabel(l) + " · " + fWhen(l.at) + parName(l.by) + "</div></div>" +
           '<div class="cagsolde mono" title="Solde après ce mouvement">' + fMontant(running) + "</div>" +
           '<button class="undo" data-cagdel="' + l.id + '">suppr.</button></div>';
      running -= l.delta;
    });
    h += "</div>";
  }
  h += "</div>";
  h += '<footer><button class="btn primary" id="cag-close">Fermer</button></footer>';

  openModal(h, function(root){
    root.querySelector("#cag-close").onclick = closeModal;
    var a = root.querySelector("#cag-add"), b = root.querySelector("#cag-sub");
    if(a) a.onclick = async function(){ var ok = await requirePin("Le code parent est demandé pour modifier une cagnotte.", true); if(ok) openCagnotte(childId, "add"); };
    if(b) b.onclick = async function(){ var ok = await requirePin("Le code parent est demandé pour modifier une cagnotte.", true); if(ok) openCagnotte(childId, "sub"); };

    if(readOnly) root.querySelectorAll("[data-cagdel]").forEach(function(x){ x.remove(); });
    root.querySelectorAll("[data-cagdel]").forEach(function(x){
      x.onclick = async function(){
        var ok = await requirePin("Le code parent est demandé pour supprimer une ligne de cagnotte.", true); if(!ok) return;
        var t = S.cagnotteLog.filter(function(y){ return y.id === x.getAttribute("data-cagdel"); })[0];
        if(t){ t.deleted = true; persistLocal(); queueSave(); render(); openCagnotte(childId); toast("Ligne supprimée"); }
      };
    });

    if(form){
      var isAdd = form === "add";
      var nEl = root.querySelector("#cag-n"), eq = root.querySelector("#cag-eq"), warn = root.querySelector("#cag-warn");
      function sync(){
        var n = parseInt(nEl.value, 10) || 0;
        eq.textContent = U();
        if(warn) warn.textContent = (n > solde) ? "La réserve ne contient que " + fMontant(solde) + "." : "";
      }
      nEl.oninput = sync; sync();
      var note = root.querySelector("#cag-note");
      root.querySelectorAll(".preset").forEach(function(pb){ pb.onclick = function(){ note.value = pb.textContent; note.focus(); }; });
      root.querySelector("#cag-back").onclick = function(){ openCagnotte(childId); };
      root.querySelector("#cag-ok").onclick = function(){
        var n = parseInt(nEl.value, 10);
        if(!(n > 0)){ nEl.focus(); nEl.style.borderColor = "var(--dang)"; return; }
        if(!isAdd && n > solde){ nEl.focus(); nEl.style.borderColor = "var(--dang)"; return; }
        var txt = note.value.trim();
        if(txt.length < 2){ note.focus(); note.style.borderColor = "var(--dang)"; return; }
        var d = root.querySelector("#cag-date").value || todayISO();
        var at = (d === todayISO()) ? nowISO() : d + "T20:00:00.000Z";
        S.cagnotteLog.push({ id: uid(), child: childId, delta: isAdd ? n : -n, note: txt, at: at,
                             week: S.weekStart, kind: isAdd ? "bonus" : "achat",
                             by: meEmail(), deleted: false });
        persistLocal(); queueSave(); render();
        openCagnotte(childId);
        toast(c.name + " : " + (isAdd ? "+" : "−") + fMontant(n) + " — " + nomCagnotte().toLowerCase());
      };
    }
  });
}

/* ====================== INSTALLATION SUR L'ÉCRAN D'ACCUEIL ======================
   Chrome n'affiche plus tout seul la fenêtre « Installer l'application » : il
   déclenche l'évènement beforeinstallprompt et laisse le site décider du moment.
   On le garde de côté, on propose un bouton, et c'est le clic qui ouvre la
   vraie fenêtre système. Sur iPhone l'évènement n'existe pas : Safari n'offre
   que le passage par le menu Partager, donc on affiche la marche à suivre.
   Source : developer.chrome.com/blog/update-install-criteria */
var promptInstall = null;
var installFaite  = false;

function estInstallee(){
  if(installFaite) return true;
  try{
    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    if(window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
  }catch(_){}
  if(window.navigator.standalone === true) return true;   /* iOS */
  return false;
}
function estIOS(){
  var ua = navigator.userAgent || "";
  if(/iPhone|iPad|iPod/i.test(ua)) return true;
  return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
}
function installMasquee(){
  try{ return localStorage.getItem("tp_install_masque") === "1"; }catch(_){ return false; }
}
function masquerInstall(){
  try{ localStorage.setItem("tp_install_masque", "1"); }catch(_){}
  renderBanners();
}
function peutProposerInstall(){
  if(estInstallee()) return false;
  if(installMasquee()) return false;
  return !!promptInstall || estIOS();
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();          /* sinon Chrome affiche sa mini-barre à son heure */
  promptInstall = e;
  try{ localStorage.removeItem("tp_install_masque"); }catch(_){}
  if(typeof S !== "undefined" && S) renderBanners();
});
window.addEventListener("appinstalled", function(){
  installFaite = true; promptInstall = null;
  try{ localStorage.removeItem("tp_install_masque"); }catch(_){}
  toast("Application installée");
  if(typeof S !== "undefined" && S) render();
});
function lancerInstall(){
  if(promptInstall){
    var p = promptInstall;
    p.prompt();
    p.userChoice.then(function(r){
      if(r && r.outcome === "accepted") promptInstall = null;
      renderBanners();
    }).catch(function(){});
    return;
  }
  aideInstall();
}
function aideInstall(){
  var pas = estIOS()
    ? '<li>Touche le bouton <b>Partager</b> en bas de Safari (le carré avec la flèche).</li>' +
      '<li>Fais défiler et choisis <b>Sur l\'écran d\'accueil</b>.</li>' +
      '<li>Valide avec <b>Ajouter</b>.</li>'
    : '<li>Ouvre le menu <b>⋮</b> en haut à droite de Chrome.</li>' +
      '<li>Choisis <b>Installer l\'application</b> — ou <b>Ajouter à l\'écran d\'accueil</b>.</li>' +
      '<li>Valide avec <b>Installer</b>.</li>';
  openModal(
    '<header><h3>Installer l\'application</h3><p>En trois gestes, depuis le navigateur.</p></header>' +
    '<div class="content"><ol style="margin:0; padding-left:20px; line-height:1.9">' + pas + '</ol>' +
    '<p style="font-size:.85rem;color:var(--ink-2);margin:14px 0 0">' +
    (estIOS()
      ? 'À faire depuis <b>Safari</b> : Chrome sur iPhone ne sait pas installer les applications web.'
      : 'Si l\'entrée n\'apparaît pas, recharge la page une fois puis rouvre le menu.') +
    '</p></div>' +
    '<footer><button class="btn primary" id="ok">J\'ai compris</button></footer>',
    function(root){ root.querySelector("#ok").onclick = closeModal; }
  );
}

/* ====================== RENDU : RÉUNION ====================== */
function ensureDraft(){
  if(!S.draft || S.draft.week !== S.weekStart){
    S.draft = { week: S.weekStart, choices: {} };
  }
  S.children.forEach(function(c){
    if(!S.draft.choices[c.id]) S.draft.choices[c.id] = { mode:null, gift:"", axisDone:null, nextAxis:"",
                                                          sanction:{ label:"", start:todayISO(), end:"", note:"" } };
    var ch0 = S.draft.choices[c.id];
    if(ch0.axisDone === undefined) ch0.axisDone = null;
    if(ch0.nextAxis === undefined) ch0.nextAxis = "";
  });
  return S.draft;
}
/* ====================== LE GRAPHIQUE DE LA SEMAINE ==================
   Une colonne par jour (le solde du jour) et, par-dessus, la courbe du
   total depuis le début de la semaine. Une seule échelle verticale pour
   les deux : deux axes feraient croire à un rapport qui n'existe pas.

   Le vert et le rouge sont le couple que les daltoniens distinguent le
   plus mal (écart perçu mesuré à 6,3 en thème clair, 5,2 en sombre, pour
   un seuil confortable de 8). Ici c'est la POSITION qui porte
   l'information — au-dessus ou en dessous de la ligne du zéro — et le
   signe est écrit dans l'infobulle. La couleur ne fait que confirmer. */

function joursDeLaSemaine(childId){
  if(!S.weekStart) return null;
  var evs = eventsOfWeek(S.weekStart, childId);
  if(!evs.length) return null;

  var debut = new Date(S.weekStart), fin = new Date();
  debut.setHours(0,0,0,0); fin.setHours(0,0,0,0);

  // Un point peut être antidaté : la fenêtre « Quand ? » laisse choisir un jour
  // passé. S'il tombe avant le début de la semaine, il compte dans le score mais
  // se retrouvait hors du graphique et du bilan du jour — donc invisible.
  // On fait commencer la frise au plus ancien des deux.
  evs.forEach(function(e){
    var d = new Date(String(e.at).slice(0, 10) + "T12:00:00");
    if(isNaN(d)) return;
    d.setHours(0,0,0,0);
    if(d < debut) debut = d;
  });

  var jours = [], curseur = new Date(debut);
  while(curseur <= fin && jours.length < 31){
    jours.push({ cle: curseur.toISOString().slice(0,10), d: new Date(curseur), solde: 0, plus: 0, moins: 0 });
    curseur.setDate(curseur.getDate() + 1);
  }
  if(!jours.length) return null;

  var parCle = {};
  jours.forEach(function(j){ parCle[j.cle] = j; });
  evs.forEach(function(e){
    var k = String(e.at).slice(0,10), j = parCle[k];
    if(!j) return;
    j.solde += e.delta;
    if(e.delta > 0) j.plus++; else j.moins++;
  });

  var t = 0;
  jours.forEach(function(j){ t += j.solde; j.cumul = t; });
  return jours;
}

var JOURS_COURTS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];

function graphiqueSemaine(childId){
  var jours = joursDeLaSemaine(childId);
  if(!jours) return "";

  // Une seule journée ne raconte aucune évolution : on montre les compteurs,
  // et la courbe apparaît dès le deuxième jour.
  var avecPoints = jours.filter(function(j){ return j.plus || j.moins; }).length;
  var dessiner = jours.length >= 2 && avecPoints >= 1;

  var W = 340, H = 170, mg = { g:28, d:16, h:16, b:24 };
  var pw = W - mg.g - mg.d, ph = H - mg.h - mg.b;

  var toutes = [];
  jours.forEach(function(j){ toutes.push(j.solde, j.cumul); });
  var maxi = Math.max.apply(null, toutes.concat([1]));
  var mini = Math.min.apply(null, toutes.concat([-1]));
  // Bornes entières : les repères tombent alors pile sur les points entiers,
  // et une colonne se lit à la graduation près sans rien mesurer à l'œil.
  var marge = Math.max(1, Math.round((maxi - mini) * 0.15));
  maxi = Math.ceil(maxi + marge); mini = Math.floor(mini - marge);

  function y(v){ return mg.h + (maxi - v) / (maxi - mini) * ph; }
  var bande = pw / jours.length;
  function xc(i){ return mg.g + bande * i + bande / 2; }
  var y0 = y(0);

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="graphsem" role="img" aria-label="' +
          esc("Points de la semaine, jour par jour et en cumul") + '">';

  // Un trait par point entier. Au-delà d'une quinzaine de graduations les
  // chiffres se chevaucheraient : on garde tous les traits, on n'écrit qu'un
  // nombre sur deux, puis sur cinq.
  var nbGrad = maxi - mini + 1;
  var pasNombre = nbGrad <= 15 ? 1 : nbGrad <= 30 ? 2 : 5;
  for(var v = mini; v <= maxi; v++){
    if(v === 0) continue;                      // la ligne du zéro est tracée à part
    var yv = y(v);
    s += '<line class="gs-grid unite" x1="' + mg.g + '" x2="' + (W - mg.d) + '" y1="' + yv.toFixed(1) +
         '" y2="' + yv.toFixed(1) + '"/>';
    if(v % pasNombre) continue;
    if(Math.abs(yv - y0) < 11) continue;       // un nombre collé au zéro se marcherait dessus
    s += '<text class="gs-axe" x="' + (mg.g - 6) + '" y="' + (yv + 3.5).toFixed(1) +
         '" text-anchor="end">' + (v > 0 ? "+" : "") + v + "</text>";
  }

  s += '<line class="gs-zero" x1="' + mg.g + '" x2="' + (W - mg.d) + '" y1="' + y0.toFixed(1) +
       '" y2="' + y0.toFixed(1) + '"/>' +
       '<text class="gs-axe" x="' + (mg.g - 6) + '" y="' + (y0 + 3.5).toFixed(1) + '" text-anchor="end">0</text>';

  var lg = Math.min(22, Math.max(6, bande - 8));
  jours.forEach(function(j, i){
    if(!j.solde) return;
    var haut = Math.abs(y(j.solde) - y0), x = xc(i) - lg / 2;
    var yy = j.solde > 0 ? y(j.solde) : y0, r = Math.min(4, lg / 2, haut);
    var d = j.solde > 0
      ? "M" + x + "," + (yy + haut) + " V" + (yy + r) + " Q" + x + "," + yy + " " + (x + r) + "," + yy +
        " H" + (x + lg - r) + " Q" + (x + lg) + "," + yy + " " + (x + lg) + "," + (yy + r) +
        " V" + (yy + haut) + " Z"
      : "M" + x + "," + yy + " V" + (yy + haut - r) + " Q" + x + "," + (yy + haut) + " " + (x + r) + "," +
        (yy + haut) + " H" + (x + lg - r) + " Q" + (x + lg) + "," + (yy + haut) + " " + (x + lg) + "," +
        (yy + haut - r) + " V" + yy + " Z";
    s += '<path d="' + d + '" class="' + (j.solde > 0 ? "gs-plus" : "gs-moins") + '"/>';
  });

  var pts = jours.map(function(j, i){ return xc(i).toFixed(1) + "," + y(j.cumul).toFixed(1); });
  s += '<polyline class="gs-ligne" points="' + pts.join(" ") + '"/>';
  jours.forEach(function(j, i){
    s += '<circle class="gs-pt" cx="' + xc(i).toFixed(1) + '" cy="' + y(j.cumul).toFixed(1) + '" r="4"/>';
  });

  // une seule valeur écrite : le total d'arrivée
  var dn = jours[jours.length - 1].cumul;
  s += '<text class="gs-val" x="' + (xc(jours.length - 1) + 8) + '" y="' + (y(dn) + 3.5).toFixed(1) +
       '">' + (dn > 0 ? "+" : "") + dn + "</text>";

  var pas = jours.length > 9 ? 2 : 1;
  jours.forEach(function(j, i){
    if(i % pas && i !== jours.length - 1) return;
    s += '<text class="gs-axe" x="' + xc(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' +
         JOURS_COURTS[j.d.getDay()] + "</text>";
  });

  jours.forEach(function(j, i){
    var titre = JOURS_COURTS[j.d.getDay()] + " " + fDate(j.cle) + " — journée " +
                (j.solde > 0 ? "+" : "") + j.solde + ", total " + (j.cumul > 0 ? "+" : "") + j.cumul;
    s += '<rect class="gs-zone" x="' + (mg.g + bande * i).toFixed(1) + '" y="' + mg.h + '" width="' +
         bande.toFixed(1) + '" height="' + ph + '"><title>' + esc(titre) + "</title></rect>";
  });

  s += "</svg>";

  var bonnes = 0, betises = 0, meilleur = null;
  jours.forEach(function(j){
    bonnes += j.plus; betises += j.moins;
    if(j.solde > 0 && (!meilleur || j.solde > meilleur.solde)) meilleur = j;
  });

  return '<div class="graphbloc">' + (dessiner ? s +
    '<p class="gs-note">Colonnes : la journée · Ligne : le total</p>' : "") +
    '<div class="gs-tuiles">' +
      '<div class="gs-tuile"><span class="k">Bonnes actions</span><b class="v-plus">' + bonnes + "</b></div>" +
      '<div class="gs-tuile"><span class="k">Bêtises</span><b class="v-moins">' + betises + "</b></div>" +
      '<div class="gs-tuile"><span class="k">Meilleur jour</span><b>' +
        (meilleur ? JOURS_COURTS[meilleur.d.getDay()] : "—") + "</b></div>" +
    "</div></div>";
}

/* ====================== LE BILAN DU JOUR ======================
   Une carte par journée, que l'on fait défiler : vers la gauche pour avancer
   dans la semaine, vers la droite pour revenir en arrière. Pendant la réunion,
   on relit la semaine jour après jour au lieu d'une longue liste. */
var jourVu = {};   // pour chaque enfant, l'index du jour affiché

function jourIndex(childId, jours){
  var i = jourVu[childId];
  if(typeof i !== "number" || i < 0 || i >= jours.length) i = jours.length - 1;   // aujourd'hui par défaut
  return i;
}

function lignesDuJour(childId, cle){
  return eventsOfWeek(S.weekStart, childId)
    .filter(function(e){ return String(e.at).slice(0, 10) === cle; })
    .slice().reverse();                                  // les plus anciennes en haut
}

function contenuJour(childId, jours, i){
  var j = jours[i];
  var lignes = lignesDuJour(childId, j.cle);
  var cls = j.solde > 0 ? "p" : j.solde < 0 ? "m" : "z";
  var mot = Math.abs(j.solde) > 1 ? "points" : "point";

  var h = '<div class="jour-nav">' +
    '<button class="jour-fl" type="button" data-jour="prec"' + (i === 0 ? " disabled" : "") +
      ' aria-label="Jour précédent">&#8249;</button>' +
    '<div class="jour-titre"><div class="eyebrow">Bilan du jour</div><b>' +
      esc(JOURS[j.d.getDay()] + " " + fDate(j.cle)) + "</b></div>" +
    '<button class="jour-fl" type="button" data-jour="suiv"' + (i === jours.length - 1 ? " disabled" : "") +
      ' aria-label="Jour suivant">&#8250;</button>' +
    "</div>";

  h += '<div class="jour-carte">' +
       '<div class="jour-solde ' + cls + '">' + (j.solde > 0 ? "+" : "") + j.solde + " " + mot + "</div>";
  if(!lignes.length){
    h += '<p class="jour-rien">Rien ce jour-là.</p>';
  } else {
    h += '<ul class="jour-lignes">';
    lignes.forEach(function(e){
      var d = new Date(e.at);
      var heure = isNaN(d) ? "" : pad(d.getHours()) + "h" + pad(d.getMinutes());
      h += '<li class="' + (e.delta > 0 ? "p" : "m") + '"><b>' + (e.delta > 0 ? "+1" : "&#8722;1") + "</b>" +
           "<span>" + esc(e.note) +
           (heure ? ' <span class="par">' + heure + "</span>" : "") +
           (e.by ? ' <span class="par">· ' + esc(whoName(e.by)) + "</span>" : "") +
           "</span></li>";
    });
    h += "</ul>";
  }
  h += "</div>";

  h += '<div class="jour-pts" aria-hidden="true">' +
       jours.map(function(_, k){ return '<i class="' + (k === i ? "on" : "") + '"></i>'; }).join("") + "</div>";
  h += '<p class="jour-aide">Glisse vers la gauche pour le jour suivant, vers la droite pour le précédent.</p>';
  return h;
}

function blocJour(childId){
  var jours = joursDeLaSemaine(childId);
  if(!jours) return '<div class="empty">Aucun mouvement cette semaine.</div>';
  return '<div class="jourbloc" data-jourbloc="' + esc(childId) + '" tabindex="0">' +
         contenuJour(childId, jours, jourIndex(childId, jours)) + "</div>";
}

function deplacerJour(bloc, childId, pas){
  var jours = joursDeLaSemaine(childId);
  if(!jours) return;
  var i = jourIndex(childId, jours) + pas;
  if(i < 0 || i >= jours.length) return;
  jourVu[childId] = i;
  bloc.innerHTML = contenuJour(childId, jours, i);
  brancherFlechesJour(bloc, childId);
}

function brancherFlechesJour(bloc, childId){
  bloc.querySelectorAll("[data-jour]").forEach(function(b){
    b.onclick = function(){ deplacerJour(bloc, childId, b.getAttribute("data-jour") === "suiv" ? 1 : -1); };
  });
}

function brancherJourbloc(bloc){
  var childId = bloc.getAttribute("data-jourbloc");
  brancherFlechesJour(bloc, childId);

  var x0 = null, y0 = null;
  bloc.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive:true });
  bloc.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    // Un geste presque vertical, c'est la page que l'on fait défiler : on ne
    // change pas de jour pour autant.
    if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    deplacerJour(bloc, childId, dx < 0 ? 1 : -1);
  }, { passive:true });

  bloc.onkeydown = function(e){
    if(e.key === "ArrowRight"){ e.preventDefault(); deplacerJour(bloc, childId, 1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); deplacerJour(bloc, childId, -1); }
  };
}

async function closeWeek(){
  var d = ensureDraft();
  var problems = [];
  S.children.forEach(function(c){
    var n = scoreOf(c.id);
    var ch = d.choices[c.id];
    var ax = axeOf(c.id);
    if(ax && ax.label && ch.axisDone === null) problems.push("Il faut dire si " + c.name + " a tenu son axe : « " + ax.label + " ».");
    if(n > 0 && !ch.mode) problems.push(c.name + " n'a pas choisi sa récompense.");
    if(n <= S.thresholds.punish && !ch.sanction.label) problems.push("La sanction de " + c.name + " n'est pas renseignée.");
    if(n <= S.thresholds.punish && ch.sanction.label && !ch.sanction.end) problems.push("La date de fin de la sanction de " + c.name + " manque.");
  });
  if(problems.length){
    openModal('<header><h3>Il manque une décision</h3></header><div class="content"><ul style="margin:0;padding-left:20px;color:var(--ink-2)">' +
      problems.map(function(p){ return "<li>" + esc(p) + "</li>"; }).join("") +
      '</ul></div><footer><button class="btn primary" id="ok">Compris</button></footer>',
      function(root){ root.querySelector("#ok").onclick = closeModal; });
    return;
  }
  var ok = await requirePin("Le code parent est demandé pour clôturer la semaine.", true);
  if(!ok) return;

  var week = S.weekStart, endISO = nowISO(), stamp = nowISO();
  var lines = S.children.map(function(c){
    var n = scoreOf(c.id);
    var ch = d.choices[c.id];
    var ax = axeOf(c.id);
    var axTenu = ch.axisDone === true;
    var tot = totalCompte(n, axTenu);
    var outcome = "rien";
    if(n > 0) outcome = ch.mode === "cagnotte" ? "cagnotte" : "trophee";
    else if(n <= S.thresholds.punish) outcome = "sanction";
    else if(n <= S.thresholds.warn) outcome = "alerte";

    if(outcome === "cagnotte" && euroValue(tot) > 0){
      S.cagnotteLog.push({ id: uid(), child: c.id, delta: euroValue(tot),
                           note: "Semaine à " + sgn(n) + " points" + (tot !== n ? " (axe tenu, comptés double)" : ""),
                           at: stamp, week: week, kind: "semaine", by: meEmail(), deleted:false });
    }
    // l'axe de la semaine qui vient
    S.axes[c.id] = ch.nextAxis && ch.nextAxis.trim()
      ? { label: ch.nextAxis.trim(), since: stamp }
      : null;
    if(outcome === "sanction"){
      S.sanctions.push({ id: uid(), child: c.id, label: ch.sanction.label, start: ch.sanction.start || dateOnly(endISO),
                         end: ch.sanction.end, note: ch.sanction.note || "", week: week, deleted:false });
    }
    return { childId:c.id, name:c.name, total:n, totalCompte:tot, outcome:outcome,
             axe: ax && ax.label ? ax.label : "", axeTenu: ax && ax.label ? axTenu : null,
             axeSuivant: (ch.nextAxis || "").trim(),
             gift: outcome === "trophee" ? (ch.gift || "") : "",
             cagnotteAdded: outcome === "cagnotte" ? euroValue(tot) : 0,
             sanction: outcome === "sanction" ? { label: ch.sanction.label, start: ch.sanction.start || dateOnly(endISO), end: ch.sanction.end } : null };
  });

  S.weeks.push({ id: week, start: week, end: endISO, closedAt: stamp, lines: lines });
  S.weekStart = stamp;
  S.draft = null;
  touch();
  go("home");
  toast("Semaine clôturée. Les compteurs repartent à zéro.");
}

/* ====================== RENDU PRINCIPAL ====================== */
var titrePose = "";
function poserTitre(){
  var t = titreApp();
  if(t === titrePose) return;
  titrePose = t;
  var b = el("brandname"); if(b) b.textContent = t;
  try{ document.title = t; }catch(e){}
}
/* Une saisie en cours interdit de réécrire l'écran : sans cela, un point coché
   par l'autre parent arrivait pendant qu'on tapait un réglage et effaçait ce
   qu'on était en train d'écrire — le bouton Enregistrer ne trouvait plus alors
   que l'ancienne valeur, et confirmait un enregistrement qui ne changeait rien. */
function saisieEnCours(){
  var a = document.activeElement;
  if(!a) return false;
  var t = (a.tagName || "").toLowerCase();
  if(t !== "input" && t !== "textarea" && t !== "select") return false;
  var vue = el("view");
  return !!(vue && vue.contains(a));
}
var renduDiffere = false;
function relancerApresSaisie(){
  document.removeEventListener("focusout", relancerApresSaisie);
  renduDiffere = false;
  setTimeout(function(){ if(S) render(); }, 80);
}

/* ====================== METTRE À JOUR ======================
   L'écran se rafraîchit tout seul quand le serveur envoie quelque chose. Trois
   cas y échappent pourtant :
     — un champ a le focus, et le rendu est mis en attente pour ne pas effacer
       ce qui est en train d'être tapé ;
     — l'application était en arrière-plan, écoutes en sommeil ;
     — une modification est partie d'un autre appareil pendant une coupure.
   D'où ce bouton, qui redemande tout au serveur et redessine sans condition. */
var derniereMaj = 0;
var majEnCours  = false;

function forcerRendu(){
  // On lève la mise en attente du rendu, quitte à quitter le champ en cours.
  if(renduDiffere){
    document.removeEventListener("focusout", relancerApresSaisie);
    renduDiffere = false;
  }
  var a = document.activeElement;
  if(a && a.blur && a !== document.body){ try{ a.blur(); }catch(e){} }
  render();
}

function mettreAJour(silencieux){
  if(majEnCours) return;
  majEnCours = true;
  derniereMaj = Date.now();

  var b = el("maj"), ico = el("maj-icone");
  if(b && !silencieux){ b.disabled = true; }
  if(ico && !silencieux){ ico.className = "tourne"; }

  // Couper puis rétablir les écoutes force une relecture complète côté serveur.
  var relance = false;
  if(fb.user && fb.base && CFG && !estEssai()){
    try{ stopSync(); startSync(); relance = true; }catch(e){}
  }

  setTimeout(function(){
    forcerRendu();
    majEnCours = false;
    if(b){ b.disabled = false; }
    if(ico){ ico.className = ""; }
    if(!silencieux){
      toast(relance ? "À jour — " + fHeure(new Date()) : "Écran rafraîchi");
    }
  }, relance ? 900 : 120);
}

function fHeure(d){
  var h = d.getHours(), m = d.getMinutes();
  return (h < 10 ? "0" : "") + h + " h " + (m < 10 ? "0" : "") + m;
}

function render(){
  poserTitre();
  var bd = el("don-bande");
  if(bd && MULTI && bd.getAttribute("data-fait") !== "1"){
    bd.innerHTML = donBandeHTML();
    bd.setAttribute("data-fait", "1");
    var a = bd.querySelector("[data-don]");
    if(a) a.onclick = function(){ var e = donEtat(); e.donne = 1; donEcrire(e); };
  }
  if(saisieEnCours()){
    // On rafraîchit tout ce qui est hors de la zone de saisie, et on reviendra
    // pour le reste dès que le champ aura perdu le focus.
    renderTabs(); renderBanners();
    if(!renduDiffere){
      renduDiffere = true;
      document.addEventListener("focusout", relancerApresSaisie);
    }
    return;
  }
  renderTabs();
  renderBanners();
  var v = el("view");
  if(UI.view === "meeting")       v.innerHTML = viewMeeting();
  else if(UI.view === "history" || UI.view === "child") v.innerHTML = viewHistory();
  else if(UI.view === "settings") v.innerHTML = viewSettings();
  else                            v.innerHTML = viewHome();
  wire(v);
  scheduleMarkSeen();
}

    var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
    b.onclick = function(){
      if(act === "plus")  addPoint(id, 1);
      if(act === "minus") addPoint(id, -1);
      if(act === "hist"){ UI.child = id; go("history", id); }
    };
  });
  v.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick = function(){ removeEvent(b.getAttribute("data-del")); };
  });
  v.querySelectorAll("[data-edit]").forEach(function(b){
    b.onclick = function(){ editEvent(b.getAttribute("data-edit")); };
  });
  v.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick = function(){ go(b.getAttribute("data-go")); };

  /* réunion */

      d.choices[id].mode = (d.choices[id].mode === m) ? null : m;

  v.querySelectorAll("[data-sanc]").forEach(function(sel){

  v.querySelectorAll("[data-sstart]").forEach(function(i){

    var mail = meEmail(); if(!mail) return;
    var val = v.querySelector("#myname").value.trim();
    if(!val) return;
    S.parentNames[mail] = val; touch(); toast("Nom enregistré");
  };
  var an = v.querySelector("#asknotif");
  if(an) an.onclick = function(){
    if(!("Notification" in window)) return;
    Notification.requestPermission().then(function(){ render(); });
  };
  var lo = v.querySelector("#logout"); if(lo) lo.onclick = logout;
  var fd = v.querySelector("#fairedon"); if(fd) fd.onclick = function(){ ouvrirDon("reglages"); };
  var vd = v.querySelector("#voirdonnees"); if(vd) vd.onclick = pageDonnees;
  var vm = v.querySelector("#voirmentions"); if(vm) vm.onclick = pageMentions;
  var cm = v.querySelector("#chgmail"); if(cm) cm.onclick = function(){ changerAdresse(false); };
  var qf = v.querySelector("#quitterfam");   if(qf) qf.onclick = quitterLaFamille;
  var sf2 = v.querySelector("#suppfam");     if(sf2) sf2.onclick = supprimerLaFamille;
  var sc = v.querySelector("#suppcompte");   if(sc) sc.onclick = supprimerMonCompte;
  var ex = v.querySelector("#exp"); if(ex) ex.onclick = exportBackup;
  var im = v.querySelector("#imp"); if(im) im.onclick = importBackup;
  var ins = v.querySelector("#inst"); if(ins) ins.onclick = lancerInstall;
  var insh = v.querySelector("#insthelp"); if(insh) insh.onclick = aideInstall;
}

/* ====================== RÉGLAGES : ACTIONS ====================== */
async function togglePin(){
  if(S.pinEnabled){
    var ok = await requirePin("Saisis le code pour le désactiver.", true);
    if(!ok) return;
    S.pinEnabled = false; touch(); toast("Code désactivé — les points se valident en un clic");
  }else{
    S.pinEnabled = true; markUnlocked(); touch();
    toast("Code réactivé — il sera demandé au prochain point");
  }
}
async function changePin(){
  var ok = await requirePin("Saisis d'abord le code actuel.", true); if(!ok) return;
  openModal('<header><h3>Nouveau code parent</h3><p>4 chiffres.</p></header>' +
    '<div class="content"><div class="field"><label for="np">Nouveau code</label><input class="input mono" id="np" inputmode="numeric" maxlength="4" data-autofocus></div></div>' +
    '<footer><button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="ok">Enregistrer</button></footer>',
    function(root){
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        var val = root.querySelector("#np").value.trim();
        if(!/^[0-9]{4}$/.test(val)) return;
        S.pin = val; closeModal(); touch(); toast("Code mis à jour");
      };
    });
}
async function addChild(){
  var ok = await requirePin("Le code parent est demandé pour ajouter un enfant.", true); if(!ok) return;
  var prises = {};
  S.children.forEach(function(x){ prises[x.couleur] = 1; });
  var couleur = coulLibre(prises);
  openModal('<header><h3>Ajouter un enfant</h3></header><div class="content">' +
    '<div class="field"><label for="nn">Prénom</label><input class="input" id="nn" data-autofocus autocomplete="off"></div>' +
    '<div class="field"><label for="nb">Date de naissance <i>(facultatif)</i></label><input class="input" type="date" id="nb"></div>' +
    '<div class="field"><label for="nc">Sa couleur</label><select class="input" id="nc">' +
      COULEURS.map(function(c){
        return '<option value="' + c.cle + '"' + (c.cle === couleur ? " selected" : "") +
               (prises[c.cle] ? " disabled" : "") + ">" + c.nom + (prises[c.cle] ? " (prise)" : "") + "</option>";
      }).join("") + "</select></div>" +
    '</div><footer><button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="ok">Ajouter</button></footer>',
    function(root){
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        var nom = root.querySelector("#nn").value.trim();
        if(nom.length < 2){ var i = root.querySelector("#nn"); i.style.borderColor = "var(--dang)"; i.focus(); return; }
        S.children.push({ id:"c_" + uid(), name:nom, birth:root.querySelector("#nb").value || "",
                          couleur:root.querySelector("#nc").value });
        closeModal(); touch(); toast(nom + " a rejoint le tableau");
      };
    });
}

async function removeChildFiche(id){
  var c = child(id); if(!c) return;
  if(S.children.length <= 1){ toast("Il doit rester au moins un enfant"); return; }
  var ok = await requirePin("Le code parent est demandé pour retirer un enfant.", true); if(!ok) return;
  var pts = eventsOfWeek(S.weekStart, id).length, sous = cagnotteOf(id);
  openModal('<header><h3>Retirer ' + esc(c.name) + ' ?</h3>' +
    '<p>Sa fiche, ses ' + pts + ' ligne' + (pts > 1 ? "s" : "") + ' de la semaine et sa réserve de ' +
    fMontant(sous) + ' disparaissent du tableau. C\'est sans retour — sauf à restaurer une sauvegarde.</p></header>' +
    '<footer><button class="btn ghost" id="cancel">Annuler</button><button class="btn danger" id="ok">Retirer</button></footer>',
    function(root){
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        // Les lignes sont marquées supprimées, jamais retirées du tableau :
        // c'est ainsi que l'effacement remonte au serveur et arrive sur l'autre
        // téléphone. Les retirer localement les ferait revenir au prochain échange.
        S.children = S.children.filter(function(x){ return x.id !== id; });
        S.events.forEach(function(e){      if(e.child === id) e.deleted = true; });
        S.cagnotteLog.forEach(function(l){ if(l.child === id) l.deleted = true; });
        S.sanctions.forEach(function(x){   if(x.child === id) x.deleted = true; });
        if(S.axes) delete S.axes[id];
        if(S.draft && S.draft.choices) delete S.draft.choices[id];
        if(UI.child === id){ UI.child = null; UI.view = "home"; }
        closeModal(); touch(); toast(c.name + " a été retiré");
      };
    });
}

async function editChild(id){
  var ok = await requirePin("Le code parent est demandé pour modifier une fiche enfant.", true); if(!ok) return;
  var c = child(id);
  var prises = {};
  S.children.forEach(function(x){ if(x.id !== id) prises[x.couleur] = x.name; });
  openModal('<header><h3>' + esc(c.name) + '</h3></header><div class="content">' +
    '<div class="field"><label for="nm">Prénom</label><input class="input" id="nm" value="' + esc(c.name) + '" data-autofocus></div>' +
    '<div class="field"><label for="bd">Date de naissance</label><input class="input" type="date" id="bd" value="' + esc(c.birth) + '"></div>' +
    '<div class="field"><label>Sa couleur</label><div class="nuancier">' +
      COULEURS.map(function(x){
        return '<button type="button" class="nuance col-' + x.cle + '" data-couleur="' + x.cle + '"' +
               ' aria-pressed="' + (c.couleur === x.cle) + '"' +
               (prises[x.cle] ? ' title="Déjà prise par ' + esc(prises[x.cle]) + '"' : ' title="' + x.nom + '"') +
               '><span class="pastille"></span>' + x.nom +
               (prises[x.cle] ? ' <i>· ' + esc(prises[x.cle]) + "</i>" : "") + "</button>";
      }).join("") +
    "</div></div>" +
    '</div><footer><button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="ok">Enregistrer</button></footer>',
    function(root){
      var choisie = c.couleur;
      root.querySelectorAll("[data-couleur]").forEach(function(b){
        b.onclick = function(){
          choisie = b.getAttribute("data-couleur");
          root.querySelectorAll("[data-couleur]").forEach(function(x){
            x.setAttribute("aria-pressed", String(x.getAttribute("data-couleur") === choisie));
          });
        };
      });
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        c.name    = root.querySelector("#nm").value.trim() || c.name;
        c.birth   = root.querySelector("#bd").value || c.birth;
        c.couleur = choisie || c.couleur;
        closeModal(); touch(); toast("Enregistré");
      };
    });
}
function exportBackup(){
  var data = JSON.stringify(S, null, 2);
  var fname = "trophee-pernin-" + todayISO() + ".json";
  try{
    var url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    var a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast("Sauvegarde téléchargée");
    return;
  }catch(e){}
  openModal('<header><h3>Sauvegarde</h3><p>Copie ce texte et garde-le en lieu sûr.</p></header>' +
    '<div class="content"><textarea class="input mono" rows="10" data-autofocus>' + esc(data) + "</textarea></div>" +
    '<footer><button class="btn primary" id="ok">Fermer</button></footer>',
    function(root){ root.querySelector("#ok").onclick = closeModal; });
}
async function importBackup(){
  var ok = await requirePin("Le code parent est demandé pour restaurer une sauvegarde.", true); if(!ok) return;
  openModal('<header><h3>Restaurer</h3><p>Colle ici le contenu d\'une sauvegarde. Les données actuelles seront fusionnées avec celles de la sauvegarde.</p></header>' +
    '<div class="content"><textarea class="input mono" id="src" rows="8" data-autofocus placeholder=\'{"v":1,...}\'></textarea></div>' +
    '<footer><button class="btn ghost" id="cancel">Annuler</button><button class="btn primary" id="ok">Restaurer</button></footer>',
    function(root){
      root.querySelector("#cancel").onclick = closeModal;
      root.querySelector("#ok").onclick = function(){
        var parsed = readJSON(root.querySelector("#src").value);
        if(!parsed || !Array.isArray(parsed.events)){ root.querySelector("#src").style.borderColor = "var(--dang)"; return; }
        S = migrate(merge(S, parsed));
        closeModal(); touch(); toast("Sauvegarde restaurée");
      };
    });
}

/* ====================== DÉMARRAGE ====================== */
var booted = false;
function startApp(){
  if(booted) return; booted = true;
  try{ boot(); }
  catch(e){
    el("view").innerHTML = '<div class="panel"><div class="empty">Une erreur est survenue au chargement : ' + esc(e && e.message) + "</div></div>";
  }
  var b = el("maj");
  if(b) b.onclick = function(){ mettreAJour(false); };

  // Au retour de l'arrière-plan, l'écran peut dater : une application rangée
  // depuis un moment n'a rien reçu entre-temps. On redemande tout, sans le dire.
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    if(Date.now() - derniereMaj < 20000) return;
    mettreAJour(true);
  });
}
if(window.FBLIB) startApp();
else{
  window.addEventListener("fblib-ready", startApp, { once:true });
  setTimeout(startApp, 8000);
}

/* ====================== LOUPE ====================== */
var ZOOM_KEY = "trophee-pernin/loupe";
var zoomNiveau = 1;
var zoomNatif = (window.CSS && CSS.supports && CSS.supports("zoom", "1.5"));

function appliqueZoom(){
  var z = el("zoomable"); if(!z) return;
  if(zoomNatif) z.style.zoom = zoomNiveau;
  else document.body.style.setProperty("--zoom", zoomNiveau);
  var v = el("zoomval");
  if(v) v.textContent = Math.round(zoomNiveau * 100) + " %";
  try{ localStorage.setItem(ZOOM_KEY, String(zoomNiveau)); }catch(e){}
}
function reglerZoom(n){
  zoomNiveau = Math.max(0.6, Math.min(3, Math.round(n * 20) / 20));
  appliqueZoom();
}
function chargerZoom(){
  var v = parseFloat(localStorage.getItem(ZOOM_KEY) || "1");
  if(isFinite(v) && v > 0) zoomNiveau = Math.max(0.6, Math.min(3, v));
  appliqueZoom();
}
el("zoombtn").onclick = function(){
  var b = el("zoombar");
  b.hidden = !b.hidden;
  if(!b.hidden) appliqueZoom();
};
el("zoombar").addEventListener("click", function(e){
  var b = e.target.closest("button[data-z]"); if(!b) return;
  var k = b.getAttribute("data-z");
  if(k === "+") reglerZoom(zoomNiveau + 0.1);
  else if(k === "-") reglerZoom(zoomNiveau - 0.1);
  else if(k === "0") reglerZoom(1);
  else if(k === "x") el("zoombar").hidden = true;
});
document.addEventListener("keydown", function(e){
  if(el("zoombar").hidden) return;
  if(e.key === "+" || e.key === "=") reglerZoom(zoomNiveau + 0.1);
  if(e.key === "-") reglerZoom(zoomNiveau - 0.1);
  if(e.key === "0") reglerZoom(1);
});
chargerZoom();

document.addEventListener("visibilitychange", function(){ if(S) render(); });
window.addEventListener("focus", function(){ if(S) render(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

})();
