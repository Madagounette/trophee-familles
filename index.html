<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trophée Pernin</title>
<meta name="description" content="Tableau de bord familial : points de la semaine, cagnotte et réunion du vendredi.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trophée Pernin">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ============================ TOKENS ============================ */
:root{
  --ground:#EDEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --surface-3:#EAECF0;
  --ink:#151922; --ink-2:#4D5665; --ink-3:#7B8492;
  --line:#DCDFE5; --line-2:#C4C9D2;
  --pos:#177A52; --pos-bg:#DFF0E7; --pos-line:#8CCBB0;
  --warn:#B85F0C; --warn-bg:#FAE7D2; --warn-line:#E5A868;
  --dang:#AC2B23; --dang-bg:#F9DED9; --dang-line:#E39189;
  --brass:#8A6412; --brass-bg:#F5EAD0; --brass-line:#D6B76A;
  /* Huit couleurs au choix pour les enfants, réparties sur toute la roue
     chromatique. Chacun choisit la sienne dans les Réglages. */
  /* Assombries jusqu'à passer 4,5:1 en texte sur leur propre fond teinté. */
  --col-bleu:#2547C4;   --col-cyan:#0B6B81;  --col-vert:#277130;   --col-ambre:#885B07;
  --col-corail:#A94029; --col-rose:#B12A6C;  --col-violet:#7A3BD1; --col-ardoise:#4C5A6E;
  --teinte:14%; --teinte-forte:20%;
  --shadow-1:0 1px 2px rgba(16,20,28,.05), 0 6px 18px -10px rgba(16,20,28,.22);
  --shadow-2:0 2px 6px rgba(16,20,28,.07), 0 22px 44px -20px rgba(16,20,28,.35);
  --r-s:8px; --r-m:14px; --r-l:20px;
  --scale:1;
  --zoom:1;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Karla","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono","SFMono-Regular",Consolas,monospace;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1117; --surface:#161A21; --surface-2:#1D222B; --surface-3:#242A34;
    --ink:#E9ECF1; --ink-2:#A5AEBB; --ink-3:#7A8492;
    --line:#282E38; --line-2:#39414D;
    --pos:#4CC08A; --pos-bg:#10281F; --pos-line:#255f47;
    --warn:#F0913E; --warn-bg:#2C1E12; --warn-line:#6d4520;
    --dang:#F2695C; --dang-bg:#2F1815; --dang-line:#71332d;
    --brass:#E0B45F; --brass-bg:#2A2213; --brass-line:#6b5527;
    --col-bleu:#8AA0FF; --col-cyan:#48BEDA;  --col-vert:#67C46F;   --col-ambre:#E3AE4D;
    --col-corail:#FF9179; --col-rose:#FF85B8; --col-violet:#BE9BFF; --col-ardoise:#9BAABF;
    --teinte:20%; --teinte-forte:28%;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 22px 44px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1117; --surface:#161A21; --surface-2:#1D222B; --surface-3:#242A34;
  --ink:#E9ECF1; --ink-2:#A5AEBB; --ink-3:#7A8492;
  --line:#282E38; --line-2:#39414D;
  --pos:#4CC08A; --pos-bg:#10281F; --pos-line:#255f47;
  --warn:#F0913E; --warn-bg:#2C1E12; --warn-line:#6d4520;
  --dang:#F2695C; --dang-bg:#2F1815; --dang-line:#71332d;
  --brass:#E0B45F; --brass-bg:#2A2213; --brass-line:#6b5527;
  --col-bleu:#8AA0FF; --col-cyan:#48BEDA;  --col-vert:#67C46F;   --col-ambre:#E3AE4D;
  --col-corail:#FF9179; --col-rose:#FF85B8; --col-violet:#BE9BFF; --col-ardoise:#9BAABF;
  --teinte:20%; --teinte-forte:28%;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 22px 44px -20px rgba(0,0,0,.8);
}

/* ============================ BASE ============================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:calc(16px * var(--scale) * var(--zoom)); line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* Paysage large : on est probablement sur la TV du salon, on lit de loin.
   L'échelle grandit avec l'écran, plus besoin d'un « mode TV » à activer. */
h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.015em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
:focus-visible{outline:2.5px solid var(--c1); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================ SHELL ============================ */
.wrap{max-width:1180px; margin:0 auto; padding:0 clamp(14px,3vw,28px)}
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.topbar .row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:11px 0}
.topbar .row > .iconbtn{justify-self:end}
.brand{display:flex; align-items:center; gap:10px; min-width:0; justify-self:start}
.brand svg{flex:none}
.brand b{font-family:var(--display); font-weight:800; font-size:1.12rem; letter-spacing:-.02em; white-space:nowrap}
.brand span{font-size:.72rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.1em; display:block; margin-top:-2px}

.tabs{display:flex; gap:2px; background:var(--surface-3); padding:3px; border-radius:999px; border:1px solid var(--line); justify-self:center}
.tabs button{
  padding:7px 15px; border-radius:999px; font-size:.86rem; font-weight:600; color:var(--ink-2);
  transition:background .16s, color .16s;
}
.tabs button[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1)}

/* pastille rouge, comme une messagerie */
.tabs button{position:relative}
.badge{
  display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px;
  margin-left:7px; border-radius:999px; background:#D93025; color:#fff;
  font-family:var(--mono); font-size:.68rem; font-weight:500; vertical-align:middle;
  box-shadow:0 0 0 2px var(--surface);
}
:root:not([data-theme="light"]) .badge{background:#F0554A; color:#1a0e0d}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .badge{background:#D93025; color:#fff} }
.feedrow[class*="col-"]{
  background:color-mix(in srgb, var(--sien) var(--teinte), var(--surface));
  box-shadow:inset 5px 0 0 var(--sien);
}
.feedrow.neuf .tagneuf{background:var(--brass); color:var(--surface); border-color:var(--brass)}
.tagneuf{
  display:inline-block; margin-left:8px; padding:1px 7px; border-radius:999px;
  background:var(--brass-bg); color:var(--brass); border:1px solid var(--brass-line);
  font-size:.64rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
}
.par{color:var(--ink-3)}

.statusbar{display:flex; justify-content:center; padding:6px 0 40px}
.majbtn{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--body); font-size:.76rem;
  color:var(--ink-2); background:none; border:0; border-left:1px solid var(--line);
  margin-left:4px; padding:0 0 0 10px; cursor:pointer; white-space:nowrap;
}
.majbtn:hover{color:var(--ink)}
.majbtn[disabled]{opacity:.55; cursor:default}
.majbtn .tourne{display:inline-block; animation:tourner .9s linear infinite}
@keyframes tourner{to{transform:rotate(360deg)}}

/* --- Le bilan du jour, une carte que l'on fait défiler --- */
.jourbloc{margin:14px 0 4px; touch-action:pan-y}
.jour-nav{display:flex; align-items:center; gap:10px; margin:0 0 8px}
.jour-nav .jour-titre{flex:1; text-align:center; min-width:0}
.jour-nav .jour-titre b{font-family:var(--display); font-size:1rem; display:block}
.jour-fl{
  flex:none; width:38px; height:38px; border-radius:50%; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-size:1.15rem; line-height:1; display:grid; place-items:center;
}
.jour-fl:hover{border-color:var(--line-2)}
.jour-fl[disabled]{opacity:.3; cursor:default}
.jour-carte{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-m);
  padding:14px 16px; min-height:96px;
}
.jour-solde{font-family:var(--display); font-size:1.6rem; line-height:1.1}
.jour-solde.p{color:var(--pos)} .jour-solde.m{color:var(--dang)} .jour-solde.z{color:var(--ink-3)}
.jour-lignes{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:7px}
.jour-lignes li{display:flex; gap:9px; align-items:baseline; font-size:.9rem}
.jour-lignes b{font-family:var(--display); flex:none; width:26px}
.jour-lignes .p b{color:var(--pos)} .jour-lignes .m b{color:var(--dang)}
.jour-lignes .par{color:var(--ink-3); font-size:.8rem}
.jour-rien{color:var(--ink-3); font-size:.9rem; margin:8px 0 0}
.jour-pts{display:flex; justify-content:center; gap:6px; margin:10px 0 0}
.jour-pts i{width:6px; height:6px; border-radius:50%; background:var(--line-2); display:block}
.jour-pts i.on{background:var(--ink-3); transform:scale(1.35)}
.jour-aide{font-size:.74rem; color:var(--ink-3); text-align:center; margin:8px 0 0}
.status{
  display:flex; align-items:center; gap:8px; font-size:.76rem; color:var(--ink-3);
  white-space:nowrap; padding:7px 14px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.dot.saving{background:var(--warn)} .dot.off{background:var(--dang)}

.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2); box-shadow:var(--shadow-1);
}
.iconbtn:hover{color:var(--ink); border-color:var(--line-2)}

.banner{
  margin:14px 0 0; padding:11px 14px; border-radius:var(--r-m); font-size:.88rem;
  background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line);
  display:flex; gap:10px; align-items:flex-start;
}
.banner.call{background:var(--brass-bg); color:var(--brass); border-color:var(--brass-line)}
.banner.soft{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}

/* --- le graphique de la semaine --- */
.graphbloc{margin:14px 0 4px}
.graphsem{display:block; width:100%; height:auto; overflow:visible}
.gs-grid{stroke:var(--line); stroke-width:1}
.gs-grid.unite{stroke:var(--line); stroke-width:1; opacity:.45}
.gs-zero{stroke:var(--line-2); stroke-width:1}
.gs-axe{font-family:var(--body); font-size:11px; fill:var(--ink-3)}
.gs-val{font-family:var(--mono); font-size:11px; font-weight:700; fill:var(--ink-2)}
.gs-plus{fill:var(--pos)}
.gs-moins{fill:var(--dang)}
.gs-ligne{fill:none; stroke:var(--ink-2); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.gs-pt{fill:var(--ink-2); stroke:var(--surface); stroke-width:2}
.gs-zone{fill:transparent}
.gs-note{font-size:.76rem; color:var(--ink-3); text-align:center; margin:2px 0 0}
.gs-tuiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 0}
.gs-tuile{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-m); padding:9px 11px}
.gs-tuile .k{display:block; font-size:.68rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em}
.gs-tuile b{font-family:var(--display); font-size:1.25rem; line-height:1.25}
.gs-tuile .v-plus{color:var(--pos)}
.gs-tuile .v-moins{color:var(--dang)}

/* --- signature de pied de page --- */
.signature{text-align:center; padding:26px 18px 34px; border-top:1px solid var(--line);
           margin-top:10px; background:var(--surface-2)}
.signature img{width:132px; height:auto; opacity:.94}
.signature .amour{font-size:.85rem; color:var(--ink-3); margin:6px 0 0}
.don-bande{display:inline-flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
           background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
           border-radius:var(--r-m); padding:10px 16px; margin:16px auto 0; font-size:.87rem;
           max-width:520px; text-align:left}
.don-bande a{color:var(--brass); font-weight:700; text-decoration:underline; white-space:nowrap}
.don-texte{white-space:normal}
.dontxt p{margin:0 0 10px}
.dontxt p:last-child{margin:0}
.banner button{font-weight:700; text-decoration:underline; color:inherit; margin-left:auto; white-space:nowrap}
.banner button + button{margin-left:12px; font-weight:600; opacity:.7}

main{padding:18px 0 8px}
.eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-3); font-weight:700}

/* ============================ WEEK STRIP ============================ */
.weekstrip{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 18px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-m); box-shadow:var(--shadow-1); margin-bottom:20px;
}
.weekstrip h2{font-size:1.05rem; font-weight:700}
.weekstrip .meta{font-size:.82rem; color:var(--ink-2)}
.weekstrip .spacer{margin-left:auto}

/* ============================ CARDS ============================ */
.grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow-1); overflow:hidden; display:flex; flex-direction:column;
}
.card .lane{height:7px}
/* Chaque enfant a sa couleur : bandeau saturé, prénom coloré, fond teinté,
   et un liseré sur ses lignes dans le fil. Le lavis seul ne suffit pas à
   distinguer trois enfants — les repères saturés font le vrai travail. */
.col-bleu{--sien:var(--col-bleu)}     .col-cyan{--sien:var(--col-cyan)}
.col-vert{--sien:var(--col-vert)}     .col-ambre{--sien:var(--col-ambre)}
.col-corail{--sien:var(--col-corail)} .col-rose{--sien:var(--col-rose)}
.col-violet{--sien:var(--col-violet)} .col-ardoise{--sien:var(--col-ardoise)}

.card .lane{background:var(--sien)}
.card[class*="col-"]{
  background:color-mix(in srgb, var(--sien) var(--teinte), var(--surface));
  border-color:color-mix(in srgb, var(--sien) calc(var(--teinte) * 2), var(--line));
}
.card .head h3{color:var(--sien)}
.card .avatar{background:color-mix(in srgb, var(--sien) 18%, var(--surface)); color:var(--sien)}
.card .chip{background:color-mix(in srgb, var(--sien) calc(var(--teinte) / 2), var(--surface))}
.card .chip.brass, .card .chip.axe{background:var(--brass-bg)}
.card .chip.bad{background:var(--dang-bg)}
.card .head{display:flex; align-items:center; gap:12px; padding:16px 18px 0}
.avatar{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-family:var(--display); font-weight:800; font-size:1.2rem; flex:none;
}
.meet-child .avatar{background:color-mix(in srgb, var(--sien) 18%, var(--surface)); color:var(--sien)}
.card .head h3{font-size:1.25rem; font-weight:700; line-height:1.1}
.card .head .age{font-size:.78rem; color:var(--ink-3)}

.scoreblock{display:flex; align-items:baseline; gap:12px; padding:10px 18px 2px}
.score{font-family:var(--display); font-weight:800; font-size:3.4rem; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.04em}
.score.z-good{color:var(--pos)} .score.z-warn{color:var(--warn)} .score.z-bad{color:var(--dang)}
.scoreunit{font-size:.85rem; color:var(--ink-3)}

.verdict{
  display:inline-flex; align-items:center; gap:7px; margin:8px 18px 0;
  padding:6px 11px; border-radius:999px; font-size:.79rem; font-weight:700; width:fit-content;
  border:1px solid transparent;
}
.v-good{background:var(--pos-bg); color:var(--pos); border-color:var(--pos-line)}
.v-none{background:var(--surface-3); color:var(--ink-2); border-color:var(--line-2)}
.v-warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line);
  background-image:repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb,var(--warn) 12%, transparent) 6px 12px)}
.v-bad{background:var(--dang-bg); color:var(--dang); border-color:var(--dang-line);
  background-image:repeating-linear-gradient(-45deg, transparent 0 5px, color-mix(in srgb,var(--dang) 18%, transparent) 5px 10px)}

/* rail */
.rail{margin:16px 18px 0; position:relative}
.railbar{height:10px; border-radius:999px; overflow:hidden; display:flex; border:1px solid var(--line)}
.railbar i{display:block; height:100%}
.railbar .s-bad{flex:1; background:color-mix(in srgb,var(--dang) 28%, var(--surface-2))}
.railbar .s-warn{flex:2; background:color-mix(in srgb,var(--warn) 24%, var(--surface-2))}
.railbar .s-mid{flex:3; background:var(--surface-3)}
.railbar .s-good{flex:4; background:color-mix(in srgb,var(--pos) 26%, var(--surface-2))}
.marker{
  position:absolute; top:-5px; width:4px; height:20px; border-radius:3px; background:var(--ink);
  transform:translateX(-2px); transition:left .3s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 0 0 2.5px var(--surface);
}
.railticks{display:flex; justify-content:space-between; margin-top:5px; font-size:.66rem; color:var(--ink-3)}

.sub{padding:14px 18px 0; display:flex; flex-direction:column; gap:9px}
.chip{
  display:flex; align-items:center; gap:9px; font-size:.82rem; padding:8px 11px;
  border-radius:var(--r-s); background:var(--surface-2); border:1px solid var(--line);
}
.chip.brass{background:var(--brass-bg); border-color:var(--brass-line); color:var(--brass)}
.chip.bad{background:var(--dang-bg); border-color:var(--dang-line); color:var(--dang)}
.chip b{font-weight:700}
.chip .r{margin-left:auto; font-family:var(--mono); font-size:.78rem}

.actions{display:flex; gap:10px; padding:16px 18px 18px; margin-top:auto}
.bigbtn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:15px 10px; border-radius:var(--r-m); font-weight:700; font-size:1rem;
  border:1.5px solid; transition:transform .1s, filter .15s;
}
.bigbtn:active{transform:scale(.97)}
.btn-plus{background:var(--pos-bg); color:var(--pos); border-color:var(--pos-line)}
.btn-minus{background:var(--dang-bg); color:var(--dang); border-color:var(--dang-line)}
.bigbtn span{font-family:var(--display); font-size:1.5rem; line-height:1; font-weight:800}
.linkbtn{
  width:100%; padding:11px; font-size:.83rem; font-weight:600; color:var(--ink-2);
  border-top:1px solid color-mix(in srgb, var(--sien, var(--line)) 22%, var(--line));
  background:color-mix(in srgb, var(--sien, transparent) calc(var(--teinte) / 2), transparent);
}
.linkbtn:hover{color:var(--ink); background:color-mix(in srgb, var(--sien, var(--ink)) calc(var(--teinte) * 1.6), transparent)}

/* ============================ FEED ============================ */
.section{margin-top:34px}
.section > h2{font-size:1.35rem; font-weight:700; margin-bottom:4px}
.section > p.lead{color:var(--ink-2); font-size:.9rem; margin:0 0 16px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow-1); overflow:hidden}
.feedrow{display:flex; gap:13px; align-items:flex-start; padding:13px 18px; border-top:1px solid var(--line)}
.feedrow:first-child{border-top:none}
.delta{
  font-family:var(--display); font-weight:800; font-size:1rem; width:34px; height:34px; flex:none;
  border-radius:10px; display:grid; place-items:center; border:1px solid;
}
.delta.p{background:var(--pos-bg); color:var(--pos); border-color:var(--pos-line)}
.delta.m{background:var(--dang-bg); color:var(--dang); border-color:var(--dang-line)}
.feedrow .body{flex:1; min-width:0}
.feedrow .who{font-weight:700; font-size:.9rem}
.feedrow .note{font-size:.92rem; color:var(--ink); overflow-wrap:anywhere; margin-top:1px}
.feedrow .when{font-family:var(--mono); font-size:.72rem; color:var(--ink-3)}
.feedrow .when b{
  color:var(--sien); font-family:var(--display); font-weight:800;
  font-size:.95rem; letter-spacing:-.015em;
}
.rowacts{display:flex; flex-direction:column; gap:5px; align-items:flex-end; align-self:center}
.undo{font-size:.75rem; color:var(--ink-3); text-decoration:underline; white-space:nowrap}
.undo:hover{color:var(--dang)}
.undo.edit:hover{color:var(--c1)}
.chip.axe{background:var(--brass-bg); border-color:var(--brass-line); color:var(--brass); align-items:flex-start}
.nuancier{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:8px}
.nuance{
  display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:var(--r-s);
  border:1.5px solid var(--line); background:var(--surface); font-size:.86rem; font-weight:600; color:var(--ink-2);
}
.nuance[aria-pressed="true"]{border-color:var(--sien); background:color-mix(in srgb, var(--sien) var(--teinte), var(--surface)); color:var(--ink)}
.nuance i{font-style:normal; font-size:.76rem; color:var(--ink-3); font-weight:400}
.pastille{
  display:inline-block; width:15px; height:15px; border-radius:50%; flex:none;
  background:var(--sien, var(--ink-3)); box-shadow:0 0 0 1px color-mix(in srgb, var(--sien) 45%, transparent);
}
.suggestion{
  display:flex; gap:10px; align-items:flex-start; width:100%; margin-top:12px; padding:12px 14px;
  text-align:left; border-radius:var(--r-m); border:1.5px dashed var(--brass-line);
  background:var(--brass-bg); color:var(--brass); font-size:.9rem; line-height:1.45;
}
.suggestion:hover{border-style:solid; filter:brightness(1.04)}
.suggestion i{font-style:normal; font-size:.82rem; opacity:.85}
.chip.axe i{font-style:normal; opacity:.85}
.empty{padding:34px 18px; text-align:center; color:var(--ink-3); font-size:.9rem}

/* ============================ MEETING ============================ */
.meet-child{border-top:1px solid var(--line); padding:22px 18px}
.meet-child[class*="col-"]{
  background:color-mix(in srgb, var(--sien) calc(var(--teinte) / 1.6), transparent);
  box-shadow:inset 6px 0 0 var(--sien);
}
.meet-child h3{color:var(--sien)}
.meet-child:first-of-type{border-top:none}
.meet-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.meet-head .score{font-size:2.6rem}
.timeline{margin:16px 0 0; padding:0 0 0 20px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:12px}
.tl{position:relative; font-size:.92rem}
.tl::before{content:""; position:absolute; left:-26px; top:6px; width:11px; height:11px; border-radius:50%; border:2px solid var(--surface)}
.tl.p::before{background:var(--pos)} .tl.m::before{background:var(--dang)}
.tl .when{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); margin-bottom:2px}
.choicebox{margin-top:18px; padding:16px; border-radius:var(--r-m); background:var(--surface-2); border:1px solid var(--line)}
.choices{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px}
.choice{
  flex:1; min-width:190px; text-align:left; padding:14px; border-radius:var(--r-m);
  border:1.5px solid var(--line); background:var(--surface); transition:border-color .15s, background .15s;
}
.choice[aria-pressed="true"]{border-color:var(--brass); background:var(--brass-bg)}
.choice b{display:block; font-family:var(--display); font-weight:700; font-size:1.02rem}
.choice small{color:var(--ink-2); font-size:.8rem}

.field{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.field label{font-size:.78rem; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.06em}
.input, select.input, textarea.input{
  width:100%; padding:11px 13px; border-radius:var(--r-s); border:1.5px solid var(--line);
  background:var(--surface); font-size:.95rem;
}
textarea.input{resize:vertical; min-height:78px; font-family:var(--body)}
.row2{display:flex; gap:12px; flex-wrap:wrap}
.row2 > *{flex:1; min-width:150px}

.btn{
  padding:11px 18px; border-radius:var(--r-m); font-weight:700; font-size:.92rem;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{background:var(--dang-bg); color:var(--dang); border-color:var(--dang-line)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.closebar{padding:20px 18px; border-top:1px solid var(--line); background:var(--surface-2); display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.closebar p{margin:0; font-size:.86rem; color:var(--ink-2); flex:1; min-width:220px}

/* ============================ MODAL ============================ */
.backdrop{
  /* Au-dessus de la porte d'entrée (#gate, z-index 100) : sans cela, les pages
     d'information ouvertes depuis l'écran de connexion s'affichaient derrière. */
  position:fixed; inset:0; z-index:120; background:rgba(9,11,16,.55);
  display:grid; place-items:center; padding:16px; overflow:auto;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%); background:var(--surface); border-radius:var(--r-l);
  border:1px solid var(--line); box-shadow:var(--shadow-2); overflow:hidden;
  animation:pop .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{transform:translateY(10px) scale(.98); opacity:0}to{transform:none; opacity:1}}
.modal header{padding:18px 20px 0}
.modal header h3{font-size:1.25rem; font-weight:700}
.modal header p{margin:4px 0 0; font-size:.87rem; color:var(--ink-2)}
.modal .content{padding:16px 20px 4px}
.modal footer{padding:16px 20px 20px; display:flex; gap:10px; justify-content:flex-end}
.presets{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px}
.preset{
  padding:7px 11px; border-radius:999px; font-size:.82rem; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2);
}
.preset:hover{border-color:var(--line-2); color:var(--ink)}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px}
.pinpad button{padding:16px 0; border-radius:var(--r-m); background:var(--surface-2); border:1px solid var(--line); font-family:var(--mono); font-size:1.25rem; font-weight:500}
.pinpad button:active{background:var(--surface-3)}
.pindots{display:flex; gap:12px; justify-content:center; margin-top:14px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2); display:block}
.pindots i.on{background:var(--ink); border-color:var(--ink)}
.err{color:var(--dang); font-size:.85rem; font-weight:600; margin-top:10px; text-align:center; min-height:1.2em}

/* ============================ TOAST ============================ */
#zoombar{
  position:fixed; right:16px; bottom:16px; z-index:95;
  display:flex; align-items:center; gap:4px; padding:6px;
  background:var(--surface); border:1px solid var(--line-2); border-radius:999px;
  box-shadow:var(--shadow-2);
}
#zoombar[hidden]{display:none}
#zoombar button{
  min-width:38px; height:38px; padding:0 12px; border-radius:999px;
  font-size:1.15rem; font-weight:700; color:var(--ink-2);
}
#zoombar button:hover{background:var(--surface-2); color:var(--ink)}
#zoombar .fermer{font-size:1.3rem; color:var(--ink-3)}
#zoombar #zoomval{min-width:74px; padding:0 8px; text-align:center; font-size:.86rem; font-weight:500; color:var(--ink)}
#zoombar #zoomval:hover{background:var(--surface-2)}

#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:var(--ink); color:var(--ground); padding:11px 17px; border-radius:999px;
  font-size:.88rem; font-weight:600; box-shadow:var(--shadow-2); pointer-events:auto;
  display:flex; gap:12px; align-items:center; animation:pop .2s;
}
.toast button{color:var(--brass); font-weight:700; text-decoration:underline; font-size:.85rem}

/* ============================ HISTORY ============================ */
.pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.pill{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:.87rem; font-weight:600; color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.wk{border-top:1px solid var(--line); padding:16px 18px}
.wk:first-child{border-top:none}
.wk h4{font-size:1rem; font-weight:700}
.wk .lines{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.wkline{display:flex; align-items:center; gap:10px; font-size:.9rem; flex-wrap:wrap}
.wkline .nm{font-weight:700; min-width:78px}
.tag{padding:3px 9px; border-radius:999px; font-size:.75rem; font-weight:700; border:1px solid}
.tag.good{background:var(--brass-bg); color:var(--brass); border-color:var(--brass-line)}
.tag.pig{background:var(--pos-bg); color:var(--pos); border-color:var(--pos-line)}
.tag.none{background:var(--surface-3); color:var(--ink-2); border-color:var(--line-2)}
.tag.bad{background:var(--dang-bg); color:var(--dang); border-color:var(--dang-line)}

table.tbl{width:100%; border-collapse:collapse; font-size:.9rem}
table.tbl th{text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); padding:10px 14px; border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 14px; border-bottom:1px solid var(--line)}
.scroller{overflow-x:auto}

/* ============================ CAGNOTTE ============================ */
.divider{
  display:flex; align-items:center; gap:10px; font-size:.67rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.13em; color:var(--ink-3);
}
.divider::after{content:""; flex:1; height:1px; background:var(--line)}
button.chip{width:100%; text-align:left; font:inherit; font-size:.82rem}
button.chip.btnlike:hover{border-color:var(--brass); filter:brightness(1.03)}
.chip .arrow{margin-left:2px; font-size:1.1rem; line-height:1; opacity:.6}

.cagsum{
  display:flex; align-items:flex-end; gap:16px; padding:16px 18px;
  border-radius:var(--r-m); background:var(--brass-bg); border:1px solid var(--brass-line);
}
.cagbig{font-family:var(--display); font-weight:800; font-size:2.6rem; line-height:1; color:var(--brass); letter-spacing:-.03em}
.cagbig small{font-size:1.1rem; font-weight:700}
.cagright{margin-left:auto; text-align:right}
.cagnext{font-size:.78rem; color:var(--brass)}
.cagform{margin-top:16px; padding:16px; border-radius:var(--r-m); background:var(--surface-2); border:1px solid var(--line)}
.amtrow{display:flex; align-items:center; gap:10px}
.amtrow .input{max-width:140px; font-size:1.15rem; font-weight:500}
.amtunit{font-size:.9rem; color:var(--ink-2); font-weight:600}
.hint{font-size:.8rem; color:var(--dang); min-height:1em}
/* Assistant de première ouverture */
.aide{display:block; font-size:.8rem; color:var(--ink-2); margin-top:6px; line-height:1.5}
.wizrow{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.wizrow input[data-nom]{flex:2; min-width:0}
.wizrow select{flex:1.2; min-width:0}
.wizrow .btn{padding:8px 12px; flex:0 0 auto}
.wizchoices{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:8px}
/* .choice impose 190px pour la réunion ; dans une grille étroite, cela déborde. */
.wizchoices .choice{width:auto; min-width:0; padding:12px}
.wizchoices .choice b{font-size:.95rem}
.check{display:flex; gap:10px; align-items:flex-start; font-size:.9rem; color:var(--ink-2); margin-top:10px; cursor:pointer}
.check input{margin-top:3px; flex:0 0 auto}
.check span{flex:1; line-height:1.45}
.lien{color:var(--brass); font-weight:700; text-decoration:underline}
.ouseparateur{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--ink-3); font-size:.8rem}
.ouseparateur::before,.ouseparateur::after{content:""; flex:1; height:1px; background:var(--line)}
.codebox{
  font-size:1.7rem; letter-spacing:.22em; text-align:center; padding:16px 10px;
  border-radius:var(--r-m); background:var(--surface-2); border:1px dashed var(--line-2);
  font-weight:700; word-break:break-all;
}
.membre{display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.membre:last-child{border-bottom:0}
.membre .r{margin-left:auto; font-size:.78rem; color:var(--ink-2); white-space:nowrap}
.caglog{margin-top:8px; max-height:300px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--r-m)}
.cagrow{display:flex; gap:12px; align-items:center; padding:11px 13px; border-top:1px solid var(--line)}
.cagrow:first-child{border-top:none}
.cagbody{flex:1; min-width:0}
.cagnote{font-size:.9rem; font-weight:600; overflow-wrap:anywhere}
.cagsolde{font-size:.78rem; color:var(--ink-3); white-space:nowrap}

/* Sur un écran large en paysage — la TV du salon — on met le fil des mouvements
   à côté des cartes plutôt qu'en dessous : tout tient sans faire défiler. */
@media (orientation: landscape) and (min-width: 1200px){
  body{ --scale:1.18 }
  .wrap{max-width:1700px}
  .home-wide{display:grid; grid-template-columns:minmax(0,2.1fr) minmax(330px,1fr); gap:20px; align-items:start}
  .hw-side .section{margin-top:0}
  .hw-side .panel{max-height:calc(100vh - 190px); overflow-y:auto}
  .meet-child{display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.85fr); gap:20px 26px; align-items:start}
  .meet-head{grid-column:1 / -1}
  .timeline{margin-top:0}
  .choicebox{margin-top:0}
}
@media (orientation: landscape) and (min-width: 1600px){ body{ --scale:1.34 } }
@media (orientation: landscape) and (min-width: 1900px){ body{ --scale:1.52 } }

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
@media (max-width:760px){
  .topbar .row{grid-template-columns:1fr auto; row-gap:9px}
  .tabs{grid-column:1 / -1; justify-self:center}
}
@media (max-width:640px){
  .score{font-size:2.9rem}
  .tabs button{padding:7px 12px; font-size:.82rem}
  .brand span{display:none}
}

/* ============================ CONNEXION ============================ */
#gate{
  position:fixed; inset:0; z-index:100; background:var(--ground);
  display:grid; place-items:center; padding:22px; overflow:auto;
}
#gate[hidden]{display:none}
.gatecard{
  width:min(400px,100%); background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-l); box-shadow:var(--shadow-2); padding:30px 26px; text-align:center;
}
.gatelogo{color:var(--brass); margin-bottom:12px}
.gatecard h1{font-size:1.55rem; font-weight:800; letter-spacing:-.02em}
.gatecard p{color:var(--ink-2); font-size:.92rem; margin:8px 0 20px}
.gatecard .field{text-align:left}
.gatecard code{font-family:var(--mono); font-size:.85em; background:var(--surface-2); padding:2px 5px; border-radius:5px}
.gatefoot{font-size:.8rem !important; color:var(--ink-3) !important; margin:16px 0 0 !important}
</style>
</head>
<body>


<div id="gate" hidden></div>

<div id="zoomable">
<div class="topbar">
  <div class="wrap row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3h10v5a5 5 0 0 1-10 0V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M7 4.5H4.5v1.8A3.2 3.2 0 0 0 7.7 9.5M17 4.5h2.5v1.8a3.2 3.2 0 0 1-3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M12 13v4m-3.5 4h7l-.8-2.4a1.5 1.5 0 0 0-1.4-1h-2.6a1.5 1.5 0 0 0-1.4 1L8.5 21Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <div>
        <b id="brandname">Trophée</b>
        <span id="brandsub">Tableau de bord familial</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <button class="iconbtn" id="zoombtn" title="Loupe — agrandir l'affichage" aria-label="Loupe">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.5 15.5 21 21M8 10.5h5M10.5 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="wrap"><div id="banners"></div></div>
<main class="wrap" id="view"></main>

<footer class="statusbar">
  <div class="status" id="status" title="État de la sauvegarde"><i class="dot"></i><span class="txt">—</span>
    <button class="majbtn" id="maj" type="button" title="Relire les données du serveur et rafraîchir l'écran">
      <span aria-hidden="true" id="maj-icone">&#8635;</span> Mettre à jour
    </button>
  </div>
</footer>

<footer class="signature">
  <picture>
    <source srcset="icons/madag-sombre.png" media="(prefers-color-scheme: dark)">
    <img src="icons/madag.png" alt="Madag Corporation" width="112" height="112">
  </picture>
  <p class="amour">Fait avec amour. <span aria-hidden="true">❤️</span></p>
  <div id="don-bande"></div>
</footer>
</div>

<div id="zoombar" hidden>
  <button data-z="-" aria-label="Réduire">−</button>
  <button id="zoomval" class="mono" data-z="0" title="Revenir à la taille normale">100 %</button>
  <button data-z="+" aria-label="Agrandir">+</button>
  <button data-z="x" class="fermer" aria-label="Fermer la loupe">×</button>
</div>
<div id="modal-root"></div>
<div id="toast"></div>


<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword,
         createUserWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification,
         deleteUser, signOut, onAuthStateChanged, reload,
         verifyBeforeUpdateEmail, EmailAuthProvider, reauthenticateWithCredential }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, collection, setDoc, getDoc, getDocs, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

window.FBLIB = {
  initializeApp, getAuth, setPersistence, browserLocalPersistence,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail,
  sendEmailVerification, deleteUser, signOut, onAuthStateChanged, reload,
  verifyBeforeUpdateEmail, EmailAuthProvider, reauthenticateWithCredential,
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, setDoc, getDoc, getDocs, deleteDoc, onSnapshot
};
window.dispatchEvent(new Event("fblib-ready"));
</script>
<script>

(function(){
"use strict";

/* ====================== CONSTANTES & DÉFAUTS ====================== */
var LS_BASE = "trophee-pernin/v1";
var SEEN_BASE = "trophee-pernin/vu";
/* En mode multi-familles, un même appareil peut servir à deux comptes :
   le cache local est donc rangé par famille, jamais mélangé. */
var LS = LS_BASE;
var SEEN_KEY = SEEN_BASE;
var PENDING = "trophee-pernin/pending";
var UNLOCK = "trophee-pernin/unlock";
var UNLOCK_MS = 30 * 60 * 1000;

/* Le nom peut être posé une fois pour toutes dans config.js, à côté des clés
   Firebase : c'est le fichier propre à chaque installation. Sinon, l'assistant
   de première ouverture le demande. */
var FAMILLE_DEFAUT = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.famille) || "";

var DEFAULTS = {
  v: 2,
  rev: 0,               // version des réglages : tranche les versions qui se croisent
  // Vide au premier démarrage : l'assistant d'installation les demande.
  famille: "",           // nom affiché en haut et dans le titre de l'onglet
  unite: "€",            // suffixe écrit après un nombre : « 5 € », « 30 min »
  uniteNom: "Cagnotte",  // nom de l'espace qui accumule
  cadeauPossible: true,  // proposer « un cadeau » en alternative à la cagnotte
  pin: "",
  pinEnabled: false,   // le code n'est plus demandé pour les + et les −
  parentNames: {},     // e-mail -> nom affiché (« Papa (Clément) »…)

// Chaque palier de 5 points complet ajoute 5 € PAR-DESSUS :
//   +1 à +4 = 5 €   ·   +5 = 10 €   ·   +10 = 15 €   ·   +15 = 20 €
function euroValue(pts){
  var p = S.palier || 5, v = S.palierValue || 5;
  if(pts <= 0) return 0;
  return v + Math.floor(pts / p) * v;
}
function palierInfo(pts){
  var p = S.palier || 5, v = S.palierValue || 5;
  var n = Math.max(0, pts);
  var euros = euroValue(n);
  var suivant = euros + v;
  // Tant que la semaine n'est pas positive, le premier trophée se gagne au premier point
  // au-dessus de zéro : à −3, il en faut quatre.
  if(euros === 0) return { euros:0, next:v, missing: 1 - Math.min(0, pts) };
  var pointsRequis = (euros / v) * p;        // 10 € demande 5 points, 15 € en demande 10
  return { euros: euros, next: suivant, missing: Math.max(0, pointsRequis - n) };
}

/* ====================== FUSION / CHARGEMENT ====================== */
function mergeById(A, B){
  var m = {}, out = [], k;
  (A||[]).forEach(function(it){ if(it && it.id) m[it.id] = it; });
  (B||[]).forEach(function(it){
    if(!it || !it.id) return;
    var cur = m[it.id];
    if(!cur){ m[it.id] = it; return; }
    var merged = {};
    for(k in cur) merged[k] = cur[k];
    for(k in it) merged[k] = it[k];
    merged.deleted = !!(cur.deleted || it.deleted);
    m[it.id] = merged;
  });
  for(k in m) out.push(m[k]);
  return out;
}
function merge(a, b){
  var newer = (new Date(b.updatedAt || 0) >= new Date(a.updatedAt || 0)) ? b : a;
  var out = clone(newer);
  out.events      = mergeById(a.events, b.events);
  out.weeks       = mergeById(a.weeks, b.weeks);
  out.sanctions   = mergeById(a.sanctions, b.sanctions);
  out.cagnotteLog = mergeById(a.cagnotteLog, b.cagnotteLog);
  var wa = a.weekStart || "", wb = b.weekStart || "";
  out.weekStart = wa > wb ? wa : wb;
  return out;
}
function migrate(s){
  var d = clone(DEFAULTS);
  ["events","weeks","sanctions","cagnotteLog"].forEach(function(k){ if(!Array.isArray(s[k])) s[k] = []; });
  if(!Array.isArray(s.children)) s.children = [];
  // Les couleurs étaient trois emplacements fixes ; elles deviennent un choix.
  var ancien = { c1:"cyan", c2:"ambre", c3:"rose" }, dispo = ["bleu","cyan","vert","ambre","corail","rose","violet","ardoise"];
  s.children.forEach(function(c, i){
    if(!c.couleur) c.couleur = ancien[c.lane] || dispo[i % dispo.length];
    delete c.lane;
  });
  if(!s.presets) s.presets = d.presets;
  ["good","bad","sanctions","cagAdd","cagSub","axes"].forEach(function(k){ if(!Array.isArray(s.presets[k])) s.presets[k] = d.presets[k]; });
  if(!s.thresholds) s.thresholds = d.thresholds;
  if(!s.palier) s.palier = d.palier;
  if(!s.palierValue) s.palierValue = d.palierValue;
  if(typeof s.pin !== "string") s.pin = d.pin;
  if(typeof s.famille !== "string" || !s.famille) s.famille = FAMILLE_DEFAUT;
  if(typeof s.unite !== "string" || !s.unite) s.unite = d.unite;
  if(typeof s.uniteNom !== "string" || !s.uniteNom) s.uniteNom = d.uniteNom;
  if(typeof s.cadeauPossible !== "boolean") s.cadeauPossible = d.cadeauPossible;
  if(typeof s.rev !== "number") s.rev = 0;
  if(typeof s.pinEnabled !== "boolean") s.pinEnabled = false;
  if(!s.parentNames || typeof s.parentNames !== "object") s.parentNames = {};
  if(!s.axes || typeof s.axes !== "object") s.axes = {};
  if(typeof s.doubleSiAxe !== "boolean") s.doubleSiAxe = true;
  // On n'invente jamais de semaine : un appareil neuf reprend celle du serveur.
  // S'il reçoit les points avant les réglages, il la déduit des points reçus.
  if(!s.weekStart){
    var archived = {};
    s.weeks.forEach(function(w){ archived[w.id] = 1; });
    var mx = null;
    s.events.forEach(function(e){ if(e.week && !archived[e.week] && (!mx || e.week > mx)) mx = e.week; });
    if(mx) s.weekStart = mx;
  }
  return s;
}

/* ====================== SYNCHRONISATION ====================== */
function onSyncError(err){
  // En multi-familles, un refus de lecture signifie le plus souvent que la
  // famille a été supprimée, ou qu'on en a été retiré : on ne laisse pas
  // l'appareil tourner sur des données qui n'existent plus.
  if(MULTI && err && err.code === "permission-denied" && moi.famille){
    oublierLaFamilleLocalement();
    if(fb.user) FBLIB.deleteDoc(FBLIB.doc(fb.db, "utilisateurs", fb.user.uid)).catch(function(){});
    showGate("famille"); render();
    return;
  }
  cloudOn = false;
  cloudWhy = "Firebase a refusé la lecture (" + ((err && err.code) || "inconnu") + ")";
  setStatus("off"); renderBanners();
}
function applyRemoteSettings(remote){
  var vue = settingsOf(remote);

  // Version plus ancienne que la nôtre : c'est notre propre passé, on l'ignore.
  if(typeof vue.rev === "number" && typeof S.rev === "number" && vue.rev < S.rev) return;
  // Filet pour les installations d'avant les numéros de version.
  if(reglagesEnAttente && !vue.rev){
    if(!vue.updatedAt || (S.updatedAt && vue.updatedAt < S.updatedAt)) return;
  }

  // Les réglages venus du serveur sont appliqués tels quels. On n'utilise PAS
  // merge() ici : il départage deux états par leur horodatage, or celui-ci
  // change à chaque point coché. Un réglage tout juste modifié se retrouvait
  // alors écarté parce qu'un point plus récent existait ailleurs — la
  // modification disparaissait sans bruit. Les listes, elles, arrivent par
  // leurs propres collections et ne passent jamais par ici.
  var semaineLocale = S.weekStart || "", k;
  for(k in vue){ if(vue[k] !== undefined && vue[k] !== null) S[k] = vue[k]; }
  S.updatedAt = remote.updatedAt || S.updatedAt || null;
  S.draft     = remote.draft || null;
  if(semaineLocale > (S.weekStart || "")) S.weekStart = semaineLocale;

  S = migrate(S);
  reglagesConnus = signatureReglages(S);
  noterSignature();
}
var firstSnap = {};
function startSync(){
  if(fb.unsubs.length) return;
  firstSnap = {};
  setStatus("saving");

  fb.unsubs.push(FBLIB.onSnapshot(fb.base, function(snap){
    cloudOn = true;
    if(!snap.exists()){ queueSave(true); firstSnap.settings = true; verifierConfiguration(); return; }
    var d = snap.data(), remote = readJSON(d && d.json);
    if(remote){ applyRemoteSettings(remote); persistLocal(); render(); }
    firstSnap.settings = true;
    setStatus("saved"); renderBanners(); verifierConfiguration();
  }, onSyncError));

  LISTS.forEach(function(k){
    var cref = FBLIB.collection(fb.db, CFG.collection, CFG.document, COLS[k]);
    fb.unsubs.push(FBLIB.onSnapshot(cref, function(snap){
      cloudOn = true;
      var remote = [];
      snap.forEach(function(d){
        var it = d.data();
        if(it && it.id){ remote.push(it); savedSig[k][it.id] = JSON.stringify(it); }
      });
      var avant = firstSnap[k];
      S[k] = mergeById(S[k], remote);
      if(k === "events" && avant) maybeNotify(remote);
      firstSnap[k] = true;
      persistLocal(); render();
      setStatus("saved"); renderBanners();
    }, onSyncError));
  });
}
function stopSync(){
  fb.unsubs.forEach(function(u){ try{ u(); }catch(e){} });
  fb.unsubs = [];
  savedSig = { events:{}, cagnotteLog:{}, sanctions:{}, weeks:{} };
}

/* ====================== ASSISTANT DE PREMIÈRE OUVERTURE ======================
   Une base vide ne contient ni nom de famille ni enfants : on pose les questions
   une fois, puis tout reste modifiable dans les Réglages. L'assistant ne se
   déclenche jamais sur une installation déjà configurée, ni pour un compte en
   lecture seule. */
var accesVerifie = false, assistantOuvert = false;

var MODELES_RECOMPENSE = [
  { cle:"argent", titre:"De l'argent",      unite:"€",    nom:"Cagnotte",           valeur:5,  ex:"5 € par palier" },
  { cle:"ecran",  titre:"Du temps d'écran", unite:"min",  nom:"Temps d'écran",      valeur:30, ex:"30 min par palier" },
  { cle:"points", titre:"Des points",       unite:"pts",  nom:"Réserve de points",  valeur:10, ex:"10 points par palier" }
];

function configurationFaite(){
  // Le seul critère est la présence d'enfants : les installations d'avant
  // l'assistant en ont, et ne doivent surtout pas se voir reposer les questions.
  return !!(S && S.children && S.children.length);
}
function verifierConfiguration(force){
  if(assistantOuvert) return;
  if(!force && (!accesVerifie || !firstSnap.settings)) return;
  if(readOnly) return;
  if(!configurationFaite()){ assistantDemarrage(); return; }
  askMyName();
  setTimeout(peutEtreLeDon, 9000);
}

function coulLibre(prises){
  for(var i = 0; i < COULEURS.length; i++) if(!prises[COULEURS[i].cle]) return COULEURS[i].cle;
  return COULEURS[0].cle;
}

function assistantDemarrage(){
  assistantOuvert = true;
  var etape = 1;
  var d = {
    famille: "",
    enfants: [{ name:"", couleur:COULEURS[1].cle }, { name:"", couleur:COULEURS[3].cle }],
    modele: "argent",
    unite: "€", uniteNom: "Cagnotte",
    palier: 5, palierValue: 5,
    cadeau: true,
    warn: -3, punish: -5,
    pin: ""
  };

  function vueEnfants(){
    return d.enfants.map(function(e, i){
      var prises = {};
      d.enfants.forEach(function(x, j){ if(j !== i) prises[x.couleur] = 1; });
      return '<div class="wizrow" data-row="' + i + '">' +
        '<input class="input" data-nom="' + i + '" value="' + esc(e.name) + '" placeholder="Prénom" autocomplete="off">' +
        '<select class="input" data-coul="' + i + '" aria-label="Couleur">' +
          COULEURS.map(function(c){
            return '<option value="' + c.cle + '"' + (e.couleur === c.cle ? " selected" : "") +
                   (prises[c.cle] ? " disabled" : "") + ">" + c.nom + (prises[c.cle] ? " (prise)" : "") + "</option>";
          }).join("") +
        "</select>" +
        (d.enfants.length > 1 ? '<button type="button" class="btn ghost" data-retirer="' + i + '" aria-label="Retirer">✕</button>' : "") +
      "</div>";
    }).join("");
  }

  function contenu(){
    if(etape === 1){
      return '<div class="content">' +
        '<div class="field"><label for="wz-fam">Le nom de la famille</label>' +
        '<input class="input" id="wz-fam" value="' + esc(d.famille) + '" placeholder="Pernin" data-autofocus>' +
        '<small class="aide">Il s\'affiche en haut de l\'application : « Trophée Pernin ».</small></div>' +
        '<div class="field"><label>Les enfants</label><div id="wz-enf">' + vueEnfants() + '</div>' +
        '<button type="button" class="btn ghost" id="wz-add" style="margin-top:8px">+ Ajouter un enfant</button></div>' +
      "</div>";
    }
    if(etape === 2){
      return '<div class="content">' +
        '<div class="field"><label>La récompense d\'une semaine positive</label><div class="wizchoices">' +
        MODELES_RECOMPENSE.map(function(m){
          return '<button type="button" class="choice" data-modele="' + m.cle + '" aria-pressed="' + (d.modele === m.cle) + '">' +
                 "<b>" + m.titre + "</b><small>" + m.ex + "</small></button>";
        }).join("") +
        '<button type="button" class="choice" data-modele="libre" aria-pressed="' + (d.modele === "libre") + '">' +
        "<b>Autre chose</b><small>À nommer soi-même</small></button>" +
        "</div></div>" +
        '<div class="row2">' +
          '<div class="field"><label for="wz-pal">Palier (points)</label><input class="input mono" type="number" id="wz-pal" min="1" value="' + d.palier + '"></div>' +
          '<div class="field"><label for="wz-val">Vaut</label><input class="input mono" type="number" id="wz-val" min="1" value="' + d.palierValue + '"></div>' +
        "</div>" +
        '<div class="row2">' +
          '<div class="field"><label for="wz-uni">Unité</label><input class="input" id="wz-uni" value="' + esc(d.unite) + '" placeholder="€"></div>' +
          '<div class="field"><label for="wz-unom">Nom de la réserve</label><input class="input" id="wz-unom" value="' + esc(d.uniteNom) + '" placeholder="Cagnotte"></div>' +
        "</div>" +
        '<label class="check"><input type="checkbox" id="wz-cad"' + (d.cadeau ? " checked" : "") +
        '><span>Proposer aussi <b>un cadeau</b>, au choix de l\'enfant</span></label>' +
        '<p class="aide" id="wz-apercu"></p>' +
      "</div>";
    }
    return '<div class="content">' +
      '<div class="row2">' +
        '<div class="field"><label for="wz-warn">Alerte à partir de</label><input class="input mono" type="number" id="wz-warn" max="0" value="' + d.warn + '"></div>' +
        '<div class="field"><label for="wz-pun">Sanction à partir de</label><input class="input mono" type="number" id="wz-pun" max="0" value="' + d.punish + '"></div>' +
      "</div>" +
      '<div class="field"><label for="wz-pin">Code parent (4 chiffres)</label>' +
      '<input class="input mono" id="wz-pin" inputmode="numeric" maxlength="4" value="' + esc(d.pin) + '" placeholder="0000">' +
      '<small class="aide">Il est demandé pour supprimer ou modifier une ligne, toucher à une réserve et clôturer la semaine — c\'est ce qui empêche un enfant de faire disparaître une bêtise. Il n\'est pas demandé pour cocher un simple + ou −.</small></div>' +
    "</div>";
  }

  function dessiner(){
    openModal(
      '<header><h3>Bienvenue</h3><p>Étape ' + etape + ' sur 3 — ' +
      (etape === 1 ? "la famille" : etape === 2 ? "la récompense" : "les seuils et le code") + '</p></header>' +
      contenu() +
      '<footer>' +
      (etape > 1 ? '<button class="btn ghost" id="wz-back">Retour</button>' : '<span></span>') +
      '<button class="btn primary" id="wz-next">' + (etape < 3 ? "Suivant" : "C\'est parti") + "</button></footer>",
      brancher
    );
  }

  function apercu(root){
    var z = root.querySelector("#wz-apercu"); if(!z) return;
    var u = (root.querySelector("#wz-uni").value.trim() || "€");
    var p = Math.max(1, parseInt(root.querySelector("#wz-pal").value, 10) || 5);
    var v = Math.max(1, parseInt(root.querySelector("#wz-val").value, 10) || 5);
    z.textContent = "Une semaine positive vaut " + v + " " + u + " ; +" + p + " points en valent " +
                    (2 * v) + " " + u + " ; +" + (2 * p) + " points, " + (3 * v) + " " + u + ".";
  }

  function lireEtape1(root){
    d.famille = root.querySelector("#wz-fam").value.trim();
    root.querySelectorAll("[data-nom]").forEach(function(i){
      d.enfants[+i.getAttribute("data-nom")].name = i.value.trim();
    });
    root.querySelectorAll("[data-coul]").forEach(function(sel){
      d.enfants[+sel.getAttribute("data-coul")].couleur = sel.value;
    });
  }
  function lireEtape2(root){
    d.palier      = Math.max(1, parseInt(root.querySelector("#wz-pal").value, 10) || 5);
    d.palierValue = Math.max(1, parseInt(root.querySelector("#wz-val").value, 10) || 5);
    d.unite       = root.querySelector("#wz-uni").value.trim() || "€";
    d.uniteNom    = root.querySelector("#wz-unom").value.trim() || "Cagnotte";
    d.cadeau      = root.querySelector("#wz-cad").checked;
  }

  function brancher(root){
    if(etape === 1){
      root.querySelector("#wz-add").onclick = function(){
        lireEtape1(root);
        var prises = {}; d.enfants.forEach(function(x){ prises[x.couleur] = 1; });
        d.enfants.push({ name:"", couleur:coulLibre(prises) });
        root.querySelector("#wz-enf").innerHTML = vueEnfants();
        brancher(root);
      };
      root.querySelectorAll("[data-retirer]").forEach(function(b){
        b.onclick = function(){
          lireEtape1(root);
          d.enfants.splice(+b.getAttribute("data-retirer"), 1);
          root.querySelector("#wz-enf").innerHTML = vueEnfants();
          brancher(root);
        };
      });
    }
    if(etape === 2){
      root.querySelectorAll("[data-modele]").forEach(function(b){
        b.onclick = function(){
          lireEtape2(root);
          d.modele = b.getAttribute("data-modele");
          var m = null;
          MODELES_RECOMPENSE.forEach(function(x){ if(x.cle === d.modele) m = x; });
          if(m){ d.unite = m.unite; d.uniteNom = m.nom; d.palierValue = m.valeur; }
          dessiner();
        };
      });
      ["#wz-uni","#wz-pal","#wz-val"].forEach(function(sel){
        var i = root.querySelector(sel); if(i) i.oninput = function(){ apercu(root); };
      });
      apercu(root);
    }
    var back = root.querySelector("#wz-back");
    if(back) back.onclick = function(){
      if(etape === 2) lireEtape2(root); 
      etape--; dessiner();
    };
    root.querySelector("#wz-next").onclick = function(){
      if(etape === 1){
        lireEtape1(root);
        if(d.famille.length < 2){ signaler(root, "#wz-fam"); return; }
        var bon = true;
        d.enfants.forEach(function(e, i){ if(e.name.length < 2){ bon = false; signaler(root, '[data-nom="' + i + '"]'); } });
        if(!bon) return;
        etape = 2; dessiner(); return;
      }
      if(etape === 2){ lireEtape2(root); etape = 3; dessiner(); return; }
      var pin = (root.querySelector("#wz-pin").value || "").replace(/\D/g, "");
      if(pin.length !== 4){ signaler(root, "#wz-pin"); return; }
      d.warn   = Math.min(0, parseInt(root.querySelector("#wz-warn").value, 10) || -3);
      d.punish = Math.min(0, parseInt(root.querySelector("#wz-pun").value, 10) || -5);
      d.pin    = pin;
      appliquerAssistant(d);
    };
  }
  function signaler(root, sel){
    var i = root.querySelector(sel); if(!i) return;
    i.style.borderColor = "var(--dang)"; i.focus();
  }

  dessiner();
}

function appliquerAssistant(d){
  S.famille        = d.famille;
  S.children       = d.enfants.map(function(e, i){
    return { id: "c_" + uid(), name: e.name, birth: "", couleur: e.couleur };
  });
  S.unite          = d.unite;
  S.uniteNom       = d.uniteNom;
  S.cadeauPossible = !!d.cadeau;
  S.palier         = d.palier;
  S.palierValue    = d.palierValue;
  S.thresholds     = { warn: d.warn, punish: d.punish };
  S.pin            = d.pin;
  S.pinEnabled     = false;
  assistantOuvert  = false;
  closeModal();
  touch();
  toast("Tout est prêt — bienvenue chez les " + d.famille);
  setTimeout(askMyName, 900);
}

/* ====================== MULTI-FAMILLES ==============================
   Chaque famille est une branche à part : familles/{id}. On sait à
   laquelle on appartient grâce à un document personnel, utilisateurs/{uid},
   que seul son propriétaire peut lire. Le cloisonnement lui-même est
   appliqué par les règles Firestore, pas par cette page : un compte qui
   n'est pas membre d'une famille n'obtient rien du serveur, même en
   devinant l'identifiant de la branche. */

function arreterAppartenance(){
  if(fb.unsubMoi){ try{ fb.unsubMoi(); }catch(e){} fb.unsubMoi = null; }
  if(fb.unsubMembres){ try{ fb.unsubMembres(); }catch(e){} fb.unsubMembres = null; }
}

/* Le chemin d'entrée, une fois l'identité connue. Passe par la porte de
   confirmation si l'adresse n'est pas encore validée. Appelé au démarrage, et
   de nouveau quand la personne revient de sa boîte aux lettres — sans recharger
   la page, pour ne pas perdre la session en route. */
function entrerAvecUtilisateur(user){
  if(!user) return;
  if(doitConfirmerSonAdresse(user)){
    stopSync(); arreterAppartenance();
    moi = { famille:null, role:null }; MEMBRES = []; CODES = [];
    cloudOn = false; setStatus("off");
    showGate("verif"); render();
    return;
  }
  if(MULTI){ suivreAppartenance(user); }
  else{ hideGate(); checkWriteAccess(user); startSync(); }
}

function suivreAppartenance(user){
  arreterAppartenance();
  fb.unsubMoi = FBLIB.onSnapshot(
    FBLIB.doc(fb.db, "utilisateurs", user.uid),
    function(snap){
      var d = snap.exists() ? snap.data() : null;
      if(!d || !d.famille){
        moi = { famille:null, role:null }; MEMBRES = [];
        stopSync(); cloudOn = false; setStatus("off");
        showGate("famille"); render();
        return;
      }
      var role = d.role || "parent";
      if(moi.famille === d.famille && moi.role === role) return;
      entrerDansLaFamille(user, d.famille, role);
    },
    function(err){
      cloudOn = false;
      cloudWhy = "impossible de lire ton compte (" + ((err && err.code) || "inconnu") + ")";
      setStatus("off"); renderBanners();
    }
  );
}

function entrerDansLaFamille(user, famille, role){
  moi = { famille: famille, role: role };
  CFG.document = famille;
  fb.base   = FBLIB.doc(fb.db, CFG.collection, famille);
  readOnly  = (role !== "parent");

  // On change de branche : on repart du cache local de CETTE famille.
  stopSync();
  LS       = LS_BASE + "/" + famille;
  SEEN_KEY = SEEN_BASE + "/" + famille;
  reglagesConnus = null;
  reglagesEnAttente = false;
  accesVerifie = false;
  loadLocalState();

  hideGate();
  checkWriteAccess(user);
  startSync();
  suivreMembres(famille);
  CODES = [];
  if(role === "parent") chargerCodes();
  render();
}

function suivreMembres(famille){
  if(fb.unsubMembres){ try{ fb.unsubMembres(); }catch(e){} fb.unsubMembres = null; }
  fb.unsubMembres = FBLIB.onSnapshot(
    FBLIB.collection(fb.db, "familles", famille, "membres"),
    function(snap){
      var out = [];
      snap.forEach(function(d){ var v = d.data() || {}; v.uid = d.id; out.push(v); });
      out.sort(function(a,b){ return (a.email || "") < (b.email || "") ? -1 : 1; });
      MEMBRES = out;
      rafraichirMonEmail();
      if(UI.view === "settings") render();
    },
    function(){}
  );
}

function nouvelIdFamille(){
  return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/* La confirmation de l'adresse est obligatoire pour tout compte ouvert à partir
   de cette date. Les familles inscrites avant gardent l'ancien régime — un
   simple bandeau — pour ne pas se retrouver enfermées dehors du jour au
   lendemain. En cas de doute sur la date de création, on ne bloque personne. */
var VERIF_DEPUIS = Date.parse("2026-08-31T00:00:00Z");

function doitConfirmerSonAdresse(user){
  if(!MULTI || !user || user.emailVerified) return false;
  var ne = (user.metadata && user.metadata.creationTime) ? Date.parse(user.metadata.creationTime) : 0;
  if(!ne || isNaN(ne)) return false;
  return ne >= VERIF_DEPUIS;
}

var ALPHABET_CODE = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // sans I, O, 0, 1 : illisibles
function nouveauCode(){
  var out = "";
  for(var i = 0; i < 8; i++) out += ALPHABET_CODE[Math.floor(Math.random() * ALPHABET_CODE.length)];
  return out;
}

function creerMaFamille(bouton, erreur){
  var user = fb.user; if(!user) return;
  var id = nouvelIdFamille();
  if(bouton){ bouton.disabled = true; bouton.textContent = "Création…"; }
  // La branche est d'abord réclamée avec le nom de son fondateur : c'est ce que
  // les règles du serveur vérifieront pour accepter le tout premier membre.
  FBLIB.setDoc(FBLIB.doc(fb.db, "familles", id), { fondateur: user.uid, at: nowISO() })
    .then(function(){
      return FBLIB.setDoc(FBLIB.doc(fb.db, "familles", id, "membres", user.uid),
                          { email: user.email || "", role: "parent", at: nowISO() });
    })
    .then(function(){
      return FBLIB.setDoc(FBLIB.doc(fb.db, "utilisateurs", user.uid),
                          { famille: id, role: "parent", email: user.email || "", at: nowISO() },
                          { merge: true });
    })
    .then(function(){
      // le suivi d'appartenance prend le relais et lance l'assistant
    })
    .catch(function(err){
      if(bouton){ bouton.disabled = false; bouton.textContent = "Créer ma famille"; }
      if(erreur) erreur.textContent = "La création a échoué (" + ((err && err.code) || "erreur") + ").";
    });
}

function rejoindreAvecCode(code, bouton, erreur){
  var user = fb.user; if(!user) return;
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(code.length !== 8){ if(erreur) erreur.textContent = "Un code compte 8 caractères."; return; }
  if(bouton){ bouton.disabled = true; bouton.textContent = "Vérification…"; }
  FBLIB.getDoc(FBLIB.doc(fb.db, "invitations", code))
    .then(function(snap){
      if(!snap.exists()) throw { code: "invitation-inconnue" };
      var inv = snap.data() || {};
      if(!inv.famille) throw { code: "invitation-incomplete" };
      if(typeof inv.expire !== "number") throw { code: "invitation-perimee" };
      if(inv.expire <= Date.now())        throw { code: "invitation-perimee" };
      return FBLIB.setDoc(FBLIB.doc(fb.db, "familles", inv.famille, "membres", user.uid),
                          { email: user.email || "", role: inv.role || "parent", code: code, at: nowISO() })
        .then(function(){
          return FBLIB.setDoc(FBLIB.doc(fb.db, "utilisateurs", user.uid),
                              { famille: inv.famille, role: inv.role || "parent",
                                email: user.email || "", at: nowISO() },
                              { merge: true });
        })
        .then(function(){
          // Le code a servi : on le brûle. C'est possible maintenant, et pas avant,
          // parce que la carte de membre vient d'être créée — le serveur n'accepte
          // cette suppression que d'un membre de la famille concernée.
          return brulerCode(code);
        });
    })
    .catch(function(err){
      if(bouton){ bouton.disabled = false; bouton.textContent = "Rejoindre"; }
      if(!erreur) return;
      var c = err && err.code;
      erreur.textContent =
        (c === "invitation-inconnue") ? "Ce code n'existe pas, il a déjà servi, ou il a été annulé."
      : (c === "invitation-perimee")  ? "Ce code a expiré. Demande-en un nouveau : ils ne valent que 48 heures."
      : "Impossible de rejoindre cette famille (" + (c || "erreur") + ").";
    });
}

/* Un code ne sert qu'une fois : il est effacé dès qu'il a été employé. Si cette
   suppression échoue (réseau coupé au mauvais moment), le code reste valable
   jusqu'à son expiration — 48 heures au maximum, jamais au-delà. */
function brulerCode(code){
  return FBLIB.deleteDoc(FBLIB.doc(fb.db, "invitations", code))
    .catch(function(){
      return new Promise(function(r){ setTimeout(r, 1500); })
        .then(function(){ return FBLIB.deleteDoc(FBLIB.doc(fb.db, "invitations", code)); })
        .catch(function(){});
    });
}

/* Un code d'invitation vit 48 heures et ne sert qu'une fois. Les deux limites
   sont vérifiées par le serveur, pas seulement par cette page. */
var INVIT_HEURES = 48;
var INVIT_MS = INVIT_HEURES * 3600000;
var CODES = [];          // les codes émis par la famille, à l'usage des parents
var codesEnCours = false;

function inviterQuelquun(role){
  if(!moi.famille || readOnly) return;
  var code = nouveauCode();
  var expire = Date.now() + INVIT_MS;
  var fiche = { famille: moi.famille, role: role, par: meEmail() || "", at: nowISO(), expire: expire };
  FBLIB.setDoc(FBLIB.doc(fb.db, "invitations", code), fiche)
    .then(function(){
      // Un double dans la branche de la famille. C'est le seul moyen pour les
      // parents de retrouver et d'annuler un code : la liste des invitations est
      // volontairement illisible, sinon n'importe qui pourrait la parcourir.
      return FBLIB.setDoc(FBLIB.doc(fb.db, "familles", moi.famille, "codes", code),
                          { role: role, par: fiche.par, at: fiche.at, expire: expire });
    })
    .then(function(){ montrerInvitation(code, role, expire); chargerCodes(); })
    .catch(function(err){ toast("L'invitation n'a pas pu être créée (" + ((err && err.code) || "erreur") + ")"); });
}

function finValidite(expire){
  if(typeof expire !== "number") return "";
  var reste = expire - Date.now();
  if(reste <= 0) return "expiré";
  var h = Math.floor(reste / 3600000);
  if(h >= 1) return "valable encore " + h + " h";
  return "valable encore " + Math.max(1, Math.round(reste / 60000)) + " min";
}

function montrerInvitation(code, role, expire){
  var quoi = (role === "parent")
    ? "Le deuxième parent aura les mêmes droits que toi."
    : "Ce compte pourra tout consulter, sans rien pouvoir modifier ni supprimer.";
  openModal(
    '<header><h3>Code d\'invitation</h3><p>' + esc(quoi) + '</p></header>' +
    '<div class="content"><div class="codebox mono" id="codeaff">' + esc(code) + "</div>" +
    '<p class="aide">La personne crée son compte sur la même adresse, choisit <b>Rejoindre une famille</b> ' +
    'et saisit ce code.</p>' +
    '<p class="aide"><b>Il ne sert qu\'une fois et expire dans ' + INVIT_HEURES + ' heures.</b> ' +
    'Passé ce délai, ou dès que quelqu\'un l\'a utilisé, il ne vaut plus rien. ' +
    'Tu peux aussi l\'annuler à tout moment depuis Réglages.</p>' +
    '<div class="err" id="copieok"></div></div>' +
    '<footer><button class="btn" id="copier">Copier</button>' +
    '<button class="btn primary" id="ok">Fermer</button></footer>',
    function(root){
      root.querySelector("#ok").onclick = closeModal;
      root.querySelector("#copier").onclick = function(){
        try{
          navigator.clipboard.writeText(code);
          root.querySelector("#copieok").textContent = "Copié.";
        }catch(e){
          root.querySelector("#copieok").textContent = "Copie impossible : note-le à la main.";
        }
      };
    }
  );
}

/* On lit les doubles rangés dans la famille, puis on demande à chacun s'il a
   encore son invitation : celle qui a disparu a servi. */
function chargerCodes(){
  if(!MULTI || !moi.famille || !fb.db || codesEnCours) return;
  codesEnCours = true;
  FBLIB.getDocs(FBLIB.collection(fb.db, "familles", moi.famille, "codes"))
    .then(function(snap){
      var lignes = [];
      snap.forEach(function(d){ var v = d.data() || {}; v.code = d.id; lignes.push(v); });
      lignes.sort(function(a, b){ return (b.at || "") < (a.at || "") ? -1 : 1; });
      return Promise.all(lignes.map(function(l){
        return FBLIB.getDoc(FBLIB.doc(fb.db, "invitations", l.code))
          .then(function(s){ l.vivant = s.exists(); return l; })
          .catch(function(){ l.vivant = false; return l; });
      }));
    })
    .then(function(lignes){
      CODES = lignes || [];
      codesEnCours = false;
      if(UI.view === "settings") render();
    })
    .catch(function(){ codesEnCours = false; });
}

function etatCode(c){
  if(!c.vivant) return { texte: "utilisé ou annulé", mort: true };
  if(typeof c.expire === "number" && c.expire <= Date.now()) return { texte: "expiré", mort: true };
  return { texte: finValidite(c.expire), mort: false };
}

function revoquerCode(code){
  if(!moi.famille || readOnly) return;
  Promise.all([
    FBLIB.deleteDoc(FBLIB.doc(fb.db, "invitations", code)).catch(function(){}),
    FBLIB.deleteDoc(FBLIB.doc(fb.db, "familles", moi.famille, "codes", code)).catch(function(){})
  ]).then(function(){
    CODES = CODES.filter(function(c){ return c.code !== code; });
    toast("Code annulé.");
    render();
  });
}

/* ====================== MON COMPTE ET MES DONNÉES ====================
   Trois portes de sortie, parce qu'on doit pouvoir partir :
   quitter la famille, effacer la famille entière, supprimer son compte.
   Rien n'est simulé : les documents sont réellement supprimés du serveur. */

function suisSeulParent(){
  var parents = MEMBRES.filter(function(m){ return m.role === "parent"; });
  return parents.length <= 1;
}

function supprimerDocs(chemins){
  var jobs = chemins.map(function(seg){
    return FBLIB.deleteDoc(FBLIB.doc.apply(null, [fb.db].concat(seg))).catch(function(){});
  });
  return Promise.all(jobs);
}

/* Le contenu d'une famille : points, réserve, sanctions, semaines, et les
   autres membres. Volontairement SANS le compte courant : c'est son propre
   statut de parent qui autorise toutes ces suppressions. L'effacer en premier
   reviendrait à se couper le bras avec lequel on travaille — le serveur
   refuserait alors le reste, et la famille resterait à moitié effacée. */
function cheminsDeLaFamille(fam){
  var out = [], moiMeme = fb.user ? fb.user.uid : null;
  LISTS.forEach(function(k){
    (S[k] || []).forEach(function(it){
      if(it && it.id) out.push(["familles", fam, COLS[k], it.id]);
    });
  });
  MEMBRES.forEach(function(m){
    if(!m.uid || m.uid === moiMeme) return;
    out.push(["familles", fam, "membres", m.uid]);
    out.push(["familles", fam, "presence", m.uid]);
  });
  // Les codes d'invitation encore en circulation partent avec la famille,
  // sinon ils resteraient à pointer vers une branche disparue.
  CODES.forEach(function(c){
    if(!c || !c.code) return;
    out.push(["familles", fam, "codes", c.code]);
    out.push(["invitations", c.code]);
  });
  return out;
}

/* L'effacement complet, dans l'ordre : le contenu d'abord, la famille ensuite,
   et sa propre carte de membre en tout dernier. */
async function effacerToutLaFamille(fam){
  var uid = fb.user ? fb.user.uid : null;
  await supprimerDocs(cheminsDeLaFamille(fam));
  if(uid) await supprimerDocs([["familles", fam, "presence", uid]]);
  await FBLIB.deleteDoc(FBLIB.doc(fb.db, "familles", fam)).catch(function(){});
  if(uid) await supprimerDocs([["familles", fam, "membres", uid]]);
}

function oublierLaFamilleLocalement(){
  moi = { famille:null, role:null };
  MEMBRES = [];
  CODES = [];
  // Une sauvegarde encore en attente recréerait la famille qu'on vient
  // d'effacer : on coupe le minuteur et on débranche la cible.
  clearTimeout(saveTimer);
  saveTimer = null;
  stopSync();
  fb.base = null;
  try{ localStorage.removeItem(LS); }catch(e){}
  LS = LS_BASE; SEEN_KEY = SEEN_BASE;
  S = migrate(clone(DEFAULTS));
  reglagesConnus = null; reglagesEnAttente = false; accesVerifie = false;
}

async function quitterLaFamille(){
  var user = fb.user; if(!user || !moi.famille) return;
  if(moi.role === "parent" && suisSeulParent()){
    toast("Tu es le seul parent : c'est la famille entière qu'il faut supprimer.");
    return;
  }
  var ok = await confirmer(
    "Quitter cette famille ?",
    "Ton compte est retiré de la famille. Les points, l'historique et les réserves restent chez les autres membres. " +
    "Tu pourras revenir plus tard avec un nouveau code d'invitation.",
    "Quitter"
  );
  if(!ok) return;
  var fam = moi.famille;
  await supprimerDocs([["familles", fam, "membres", user.uid], ["familles", fam, "presence", user.uid]]);
  await FBLIB.deleteDoc(FBLIB.doc(fb.db, "utilisateurs", user.uid)).catch(function(){});
  oublierLaFamilleLocalement();
  showGate("famille"); render();
  toast("Tu as quitté la famille");
}

async function supprimerLaFamille(){
  var user = fb.user; if(!user || !moi.famille || readOnly) return;
  var nom = S.famille || "cette famille";
  var ok = await confirmerAvecMot(
    "Supprimer la famille " + nom + " ?",
    "Tout disparaît définitivement : les enfants, tous les points et leurs explications, les réserves, " +
    "les sanctions, les semaines archivées, et l'accès de chaque membre. Personne ne pourra revenir en arrière. " +
    "Si tu veux en garder une trace, télécharge d'abord la sauvegarde.",
    nom, "Tout supprimer"
  );
  if(!ok) return;
  var pin = await requirePin("Le code parent est demandé pour supprimer la famille.", true);
  if(!pin) return;

  var fam = moi.famille;
  toast("Suppression en cours…");
  await effacerToutLaFamille(fam);
  await FBLIB.deleteDoc(FBLIB.doc(fb.db, "utilisateurs", user.uid)).catch(function(){});
  oublierLaFamilleLocalement();
  showGate("famille"); render();
  toast("La famille a été supprimée");
}

async function supprimerMonCompte(){
  var user = fb.user; if(!user) return;
  var seul = (moi.role === "parent" && suisSeulParent());
  var ok = await confirmerAvecMot(
    "Supprimer ton compte ?",
    (seul
      ? "Tu es le seul parent de cette famille : sa suppression entraîne celle de toutes ses données — " +
        "enfants, points, réserves, historique. "
      : "Ton compte est retiré de la famille ; ses données restent chez les autres membres. ") +
    "Ton adresse et ton mot de passe sont effacés du service. C'est définitif.",
    "SUPPRIMER", "Supprimer mon compte"
  );
  if(!ok) return;

  if(moi.famille){
    var fam = moi.famille;
    if(seul){
      await effacerToutLaFamille(fam);
    } else {
      await supprimerDocs([["familles", fam, "membres", user.uid], ["familles", fam, "presence", user.uid]]);
    }
    await FBLIB.deleteDoc(FBLIB.doc(fb.db, "utilisateurs", user.uid)).catch(function(){});
  }
  oublierLaFamilleLocalement();
  arreterAppartenance();
  try{
    await FBLIB.deleteUser(user);
    toast("Compte supprimé");
  }catch(err){
    if(err && err.code === "auth/requires-recent-login"){
      await FBLIB.signOut(fb.auth).catch(function(){});
      openModal(
        '<header><h3>Reconnecte-toi une dernière fois</h3>' +
        '<p>Tes données ont bien été effacées. Pour supprimer l\'adresse et le mot de passe eux-mêmes, ' +
        'le service demande une connexion récente : reconnecte-toi, puis relance la suppression du compte. ' +
        'C\'est une sécurité contre les suppressions faites depuis un téléphone laissé sans surveillance.</p></header>' +
        '<footer><button class="btn primary" id="ok">J\'ai compris</button></footer>',
        function(root){ root.querySelector("#ok").onclick = closeModal; });
      return;
    }
    toast("La suppression du compte a échoué (" + ((err && err.code) || "erreur") + ")");
  }
}

/* --- petites fenêtres de confirmation --- */
function confirmer(titre, texte, motBouton){
  return new Promise(function(resolve){
    openModal(
      '<header><h3>' + esc(titre) + '</h3><p>' + esc(texte) + '</p></header>' +
      '<footer><button class="btn ghost" id="non">Annuler</button>' +
      '<button class="btn danger" id="oui">' + esc(motBouton) + '</button></footer>',
      function(root){
        root.querySelector("#non").onclick = function(){ closeModal(); resolve(false); };
        root.querySelector("#oui").onclick = function(){ closeModal(); resolve(true); };
      });
  });
}
function confirmerAvecMot(titre, texte, mot, motBouton){
  return new Promise(function(resolve){
    openModal(
      '<header><h3>' + esc(titre) + '</h3><p>' + esc(texte) + '</p></header>' +
      '<div class="content"><div class="field"><label for="confmot">Pour confirmer, écris <b>' + esc(mot) + '</b></label>' +
      '<input class="input" id="confmot" data-autofocus autocomplete="off"></div>' +
      '<div class="err" id="conferr"></div></div>' +
      '<footer><button class="btn ghost" id="non">Annuler</button>' +
      '<button class="btn danger" id="oui">' + esc(motBouton) + '</button></footer>',
      function(root){
        root.querySelector("#non").onclick = function(){ closeModal(); resolve(false); };
        root.querySelector("#oui").onclick = function(){
          var v = root.querySelector("#confmot").value.trim();
          if(v.toLowerCase() !== String(mot).toLowerCase()){
            root.querySelector("#conferr").textContent = "Ce n'est pas ce qui est demandé.";
            return;
          }
          closeModal(); resolve(true);
        };
      });
  });
}
